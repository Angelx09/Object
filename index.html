<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Price of Luck</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #191919;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Change the background image here. */
    .page-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #9a9a9a url("images/bg.jpeg") center / cover no-repeat;
    }

    .site-title,
    .scroll-hint {
      position: fixed;
      z-index: 2;
      inset-inline: 16px;
      margin: 0;
      text-align: center;
      color: white;
      text-shadow: 0 1px 6px #000;
      pointer-events: none;
    }

    .site-title {
      top: 24px;
      font: normal 25px Georgia, serif;
    }

    .scroll-hint {
      bottom: 24px;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .scroll-track {
      height: 350vh;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .archive {
      --card-width: 210px;
      --card-height: 290px;
      position: absolute;
      top: calc(50% - var(--card-height) / 2);
      left: calc(50% - var(--card-width) / 2);
    }

    .archive-card {
      position: absolute;
      width: var(--card-width);
      height: var(--card-height);
      padding: 0;
      /* Transparency keeps the same background pixels visible through each card. */
      background: transparent;
      border: 1px solid rgb(255 255 255 / 48%);
      box-shadow: 1px 2px 5px rgb(0 0 0 / 18%);
      cursor: pointer;
      transform: translate(var(--x), var(--y)) skewY(-8deg);
      transition: transform .25s ease, border-color .25s ease;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      z-index: 1;
      border-color: #fff;
      transform: translate(var(--x), calc(var(--y) - 28px)) skewY(-8deg);
    }

    .archive-card:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .postcard {
      width: min(380px, calc(100vw - 32px));
      height: min(570px, calc(100dvh - 32px));
      max-height: none;
      padding: 0;
      border: 0;
      background: white;
      color: inherit;
      overflow: hidden;
    }

    .postcard::backdrop {
      background: rgb(0 0 0 / 58%);
    }

    .postcard-face {
      height: 100%;
    }

    .postcard-face[hidden],
    .purchase-link[hidden] {
      display: none;
    }

    .postcard-front {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      text-align: center;
    }

    .object-heading {
      padding: 14px 16px;
      background: var(--section-color, #fff500);
    }

    .object-number {
      font-size: 11px;
      letter-spacing: .08em;
    }

    .object-title {
      margin: 5px 0 0;
      font: normal clamp(22px, 5vw, 32px) / 1.05 Georgia, serif;
    }

    .object-photo {
      display: grid;
      place-items: center;
      min-height: 0;
      margin: 16px 14%;
      border-inline: 2px solid #ff0098;
      font-size: 48px;
    }

    .object-photo img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
    }

    .object-caption {
      margin: 0;
      padding: 0 16px 8px;
      font: 17px Georgia, serif;
    }

    .postcard-back {
      display: flex;
      flex-direction: column;
      background: var(--section-color, #fff500);
    }

    .story-content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 24px;
      align-content: safe center;
    }

    .object-story {
      margin: 0;
      font: 18px / 1.45 Georgia, serif;
      white-space: pre-wrap;
    }

    .purchase-link {
      display: inline-block;
      margin-top: 16px;
      color: inherit;
      font-size: 13px;
    }

    .flip-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-top: 1px solid rgb(0 0 0 / 12%);
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .archive {
        --card-width: 170px;
        --card-height: 235px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .archive-card {
        transition: none;
      }
    }
    .archive-card {
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px #191919, 3px 5px 0 #191919;
}

.archive-card:hover,
.archive-card:focus-visible {
  border-color: #fff500;
}
  </style>
</head>

<body>
  <div class="page-background" aria-hidden="true"></div>

  <header>
    <h1 class="site-title">The Price of Luck</h1>
  </header>

  <main id="track" class="scroll-track" aria-label="Lucky object archive">
    <div class="scene">
      <div id="archive" class="archive"></div>
    </div>
  </main>

  <p class="scroll-hint">SCROLL TO EXPLORE · TAP A CARD TO REVEAL</p>

  <dialog id="postcard" class="postcard" aria-label="Object details">
    <section id="front" class="postcard-face postcard-front">
      <div class="object-heading">
        <div id="objectNumber" class="object-number"></div>
        <h2 id="objectTitle" class="object-title"></h2>
      </div>

      <div id="objectPhoto" class="object-photo"></div>
      <p id="objectCaption" class="object-caption"></p>
      <button id="showStory" class="flip-button" type="button">Flip to read the story ↗</button>
    </section>

    <section id="back" class="postcard-face postcard-back" hidden>
      <div class="story-content">
        <p id="objectStory" class="object-story"></p>
        <a id="purchaseLink" class="purchase-link"
           target="_blank" rel="noopener noreferrer" hidden></a>
      </div>

      <button id="showObject" class="flip-button" type="button">Back to the object ↶</button>
    </section>
  </dialog>

  <script src="objects.js"></script>
  <script>
    const track = document.getElementById("track");
    const archive = document.getElementById("archive");
    const postcard = document.getElementById("postcard");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const photo = document.getElementById("objectPhoto");
    const caption = document.getElementById("objectCaption");
    const story = document.getElementById("objectStory");
    const purchaseLink = document.getElementById("purchaseLink");
    const showStory = document.getElementById("showStory");
    const showObject = document.getElementById("showObject");

    const stepX = 28;
    const stepY = -10;
    const lastIndex = Math.max(0, objects.length - 1);

    let lastTrigger = null;
    let previousOverflow = "";

    function updateStack() {
      const scrollDistance = Math.max(1, track.offsetHeight - window.innerHeight);
      const progress = Math.min(1, Math.max(0, window.scrollY / scrollDistance));

      archive.style.transform =
        "translate(" + (-progress * lastIndex * stepX) + "px, "
        + (-progress * lastIndex * stepY) + "px)";
    }

    function setFace(showingStory) {
      front.hidden = showingStory;
      back.hidden = !showingStory;

      if (postcard.open) {
        (showingStory ? showObject : showStory).focus();
      }
    }

    function showPhoto(object) {
      const fallback = document.createElement("span");
      fallback.textContent = object.symbol || "◇";
      fallback.setAttribute("aria-hidden", "true");
      photo.replaceChildren(fallback);

      if (!object.image) return;

      const image = document.createElement("img");
      image.alt = object.name;
      image.style.display = "none";

      image.addEventListener("load", () => {
        fallback.remove();
        image.style.display = "block";
      });

      image.addEventListener("error", () => image.remove());
      photo.append(image);
      image.src = object.image;
    }

    function openObject(object, trigger) {
      lastTrigger = trigger;
      previousOverflow = document.body.style.overflow;

      const sectionColor = typeof getObjectSectionColor === "function"
        ? getObjectSectionColor(object)
        : "#fff500";

      postcard.style.setProperty("--section-color", sectionColor);
      postcard.setAttribute("aria-label", object.name);
      document.getElementById("objectNumber").textContent = "Object " + object.id;
      document.getElementById("objectTitle").textContent = object.name;
      caption.textContent = object.description ?? "";
      caption.hidden = !caption.textContent;
      story.textContent = object.backText ?? object.backtxt ?? "";
      showPhoto(object);

      purchaseLink.hidden = true;
      purchaseLink.removeAttribute("href");

      if (object.purchaseUrl) {
        try {
          const url = new URL(object.purchaseUrl);
          if (url.protocol === "https:" || url.protocol === "http:") {
            purchaseLink.href = url.href;
            purchaseLink.textContent = (object.purchaseLabel || "Visit website") + " ↗";
            purchaseLink.hidden = false;
          }
        } catch {
          // Leave the link hidden when the URL is invalid.
        }
      }

      back.querySelector(".story-content").scrollTop = 0;
      setFace(false);
      postcard.showModal();
      document.body.style.overflow = "hidden";
      showStory.focus({ preventScroll: true });
    }

    objects.forEach((object, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "archive-card";
      card.setAttribute("aria-label", "Reveal " + object.name);
      card.setAttribute("aria-haspopup", "dialog");
      card.style.setProperty("--x", (index * stepX) + "px");
      card.style.setProperty("--y", (index * stepY) + "px");
      card.addEventListener("click", () => openObject(object, card));
      archive.append(card);
    });

    archive.addEventListener("focusin", (event) => {
      if (!event.target.matches(".archive-card:focus-visible") || postcard.open) return;

      const index = Array.from(archive.children).indexOf(event.target);
      const bounds = event.target.getBoundingClientRect();

      if (bounds.left < 0 || bounds.right > window.innerWidth ||
          bounds.top < 0 || bounds.bottom > window.innerHeight) {
        const scrollDistance = track.offsetHeight - window.innerHeight;
        window.scrollTo(0, (index / Math.max(1, lastIndex)) * scrollDistance);
        updateStack();
      }
    });

    showStory.addEventListener("click", () => setFace(true));
    showObject.addEventListener("click", () => setFace(false));

    postcard.addEventListener("click", (event) => {
      if (event.target !== postcard) return;

      const bounds = postcard.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) {
        postcard.close();
      }
    });

    postcard.addEventListener("close", () => {
      document.body.style.overflow = previousOverflow;
      lastTrigger?.focus({ preventScroll: true });
    });

    window.addEventListener("scroll", updateStack, { passive: true });
    window.addEventListener("resize", updateStack);
    updateStack();
  </script>
</body>
</html>
