<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Price of Luck</title>

  <style>
    * {
      box-sizing: border-box;
    }

   @import url("https://use.typekit.net/wcs7vbf.css");

    body,
    .site-title,
    .instructions,
    .archive-about,
    .object-title,
    .caption,
    .story-text,
    .flip-button {
      font-family: "neue-haas-grotesk-display", Arial, sans-serif;
    }   
    .page-background {
      position: fixed;
      inset: 0;
      background: #555 url("images/bg.jpeg") center / cover no-repeat;
    }

    .site-title,
    .instructions {
      position: fixed;
      z-index: 2;
      left: 16px;
      right: 16px;
      margin: 0;
      color: white;
      text-shadow: 0 1px 5px black, 0 0 12px black;
      text-align: center;
      pointer-events: none;
    }

    .site-title {
      top: 24px;
      font: 28px Georgia, serif;
    }

    .instructions {
      bottom: 24px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .scroll-track {
      position: relative;
      height: 350vh;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .stack {
      --card-width: clamp(150px, 36vw, 210px);
      --card-height: clamp(210px, 50vw, 290px);
      position: absolute;
      top: calc(50% - var(--card-height) / 2);
      left: calc(50% - var(--card-width) / 2);
      width: var(--card-width);
      height: var(--card-height);
    }

    .archive-card {
      position: absolute;
      inset: 0;
      z-index: var(--layer);
      transform: translate(var(--card-x), var(--card-y)) skewY(-8deg);
      border: 2px solid white;
      box-shadow: 0 0 0 1px #191919, 2px 3px 0 #191919;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      z-index: 100;
      border-color: #fff500;
      transform:
        translate(var(--card-x), calc(var(--card-y) - 16px))
        skewY(-8deg);
    }

    .archive-card:focus-visible {
      outline: 2px solid #191919;
      outline-offset: 3px;
    }

    .card-number {
      position: absolute;
      right: 3px;
      bottom: 6px;
      padding: 3px;
      background: #191919;
      color: white;
      font: 9px / 1 Arial, sans-serif;
    }

    .postcard {
      width: min(380px, calc(100vw - 32px));
      height: min(570px, calc(100dvh - 32px));
      max-height: none;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: white;
      color: #191919;
    }

    .postcard::backdrop {
      background: rgb(0 0 0 / 65%);
    }

    .front,
    .back {
      height: 100%;
    }

    [hidden] {
      display: none !important;
    }

    .front {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      text-align: center;
    }

    .object-heading,
    .back {
      background: var(--section-color, #fff500);
    }

    .object-heading {
      padding: 14px 16px;
    }

    .object-number {
      font-size: 11px;
      letter-spacing: .08em;
    }

    .object-title {
      margin: 5px 0 0;
      font: normal clamp(22px, 5vw, 32px) / 1.05 Georgia, serif;
    }

    .object-photo {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      margin: 16px 14%;
      border-inline: 2px solid #ff0098;
      font-size: 48px;
    }

    .object-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      margin: 0;
      padding: 0 16px 10px;
      font: 17px Georgia, serif;
    }

    .back {
      display: flex;
      flex-direction: column;
    }

    .story-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
      padding: 28px;
    }

    .story-text {
      margin: auto 0;
      font: 18px / 1.45 Georgia, serif;
      white-space: pre-wrap;
    }

    .purchase-link {
      display: inline-block;
      align-self: flex-start;
      margin-top: 16px;
      color: inherit;
      font-size: 13px;
    }

    .flip-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-top: 1px solid rgb(0 0 0 / 20%);
      background: transparent;
      color: inherit;
      font: 12px Arial, sans-serif;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .archive-card {
        transition: none;
      }
    }
    .archive-about {
  position: fixed;
  z-index: 3;
  top: 43%;
  left: 24px;
  width: min(190px, calc(100% - 48px));
  padding: 12px 14px;
  color: white;
  pointer-events: none;
}

.archive-about h2 {
  margin: 0 0 6px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.archive-about p {
  margin: 0;
  font-size: 13px;
  line-height: 1.45;
}

@media (max-width: 700px) {
  .archive-about {
    top: 68px;
    left: 16px;
    width: min(260px, calc(100% - 32px));
  }
}
  </style>
</head>

<body>
  <div class="page-background" aria-hidden="true"></div>

  <header>
    <h1 class="site-title">The Price of Luck</h1>
  </header>
  <aside class="archive-about" aria-labelledby="archive-about-title">
  <h2 id="archive-about-title">About the Archive</h2>
  <p>A collection of objects believed to carry luck, protection, and personal meaning.</p>
</aside>

  <main class="scroll-track" id="track" aria-label="Lucky object archive">
    <div class="scene">
      <div class="stack" id="stack"></div>
    </div>
  </main>

  <p class="instructions">Scroll to explore · Click a card to reveal</p>

  <dialog class="postcard" id="postcard" aria-labelledby="objectTitle">
    <section class="front" id="front">
      <div class="object-heading">
        <div class="object-number" id="objectNumber"></div>
        <h2 class="object-title" id="objectTitle"></h2>
      </div>

      <div class="object-photo" id="objectPhoto"></div>
      <p class="caption" id="objectCaption"></p>


    </section>

    <section class="back" id="back" hidden>
      <div class="story-content" id="storyContent">
        <p class="story-text" id="objectStory"></p>
        <a class="purchase-link" id="purchaseLink"
           target="_blank" rel="noopener noreferrer" hidden></a>
      </div>

      <button class="flip-button" id="showObject" type="button">
        Back to the object ↶
      </button>
    </section>
    <dialog class="postcard" id="postcard" aria-labelledby="objectTitle">
  <div class="postcard-panel">
    <!-- Your existing front and back sections go here. -->
  </div>
</dialog>
  </dialog>


  <script>
    // Edit your postcard names, image filenames, and stories here.
    const colors = {
      wearables: "#FFF500",
      rituals: "#FF9BCB",
      paper: "#B9DFFF",
      keychains: "#BFE6AE",
      found: "#FFC18C",
      others: "#CDBBFA"
    };

    const fortuneNote = {
      name: "Fortune Note",
      image: "fortune-note.jpg"
    };

    const clover = {
      name: "Four-Leaf Clover",
      image: "four-leaf-clover.jpg"
    };

    const watchPlaceholder = {
      name: "watch",
      image: "four-leaf-clover.jpg"
    };

    const objects = [
      {
        id: 1,
        name: "Jade Heart Necklace",
        image: "jade-heart-necklace.png",
        category: "wearables",
        description: "Chloe C",
        backText: "Every summer, Chloe’s mom would buy her a jade necklace. Over time, it became their tradition. Chloe wore hers every day, wherever she went. She believed the jade brought her luck and protection, and it felt especially meaningful because it came from her mom. When the jade chipped and its green color faded, Chloe felt as though some of its luck had faded with it. Her mom bought her another necklace, and Chloe has kept it for years. By now, it holds memories of her mom and all the time she’s spent wearing it. If she ever lost it, she’d do everything she could to find it again."
      },
      {
        id: 2,
        name: "Scorpio Necklace",
        image: "Yellow GOld Scorpio Necklace.png",
        category: "wearables",
        description: "Coby",
        backText: "Coby got it at a crystal shop in Hawaii a few years ago. It’s been with Coby for so long that it’s come to feel lucky. “It’s like a child to me,” Coby says. It’s something Coby plans to keep forever."
      },
      {
        id: 3,
        name: "Polished Wooden Bead Bracelet",
        image: "polished-wooden-bead-bracelet.png",
        category: "wearables",
        description: "Dad"
      },
      {
        id: 4,
        name: "Golden Bead Bracelet",
        image: "golden-bead-bracelet.png",
        category: "wearables",
        description: "Mom"
      },
      {
        id: 5,
        name: "Red Twisted Cord with Gold Charm",
        image: "red-twisted-cord.png",
        category: "wearables",
        description: "Anne L",
        backText: "My mom gave me this gold Winnie the Pooh necklace for my sixth birthday. In Chinese culture, giving someone gold can be a way of wishing them good luck. I’ve had this necklace for so long that it holds memories from different parts of my life. When I wear it, I feel like I’m carrying a little of that luck with me, along with a reminder of my mom’s love."
      },
      {
        id: 6,
        name: "Watch",
        image: "watch.jpeg",
        category: "wearables",
        description: "Faizul Rahman",
        backText: "I think I started thinking of my watch as lucky in 2023, when I wore it to an accounting exam. I hadn’t studied much, so I went in nervous and just hoping to pass. I ended up with a decent grade, and that gave me a little more confidence. Ever since, this is the watch I reach for when I have something important coming up."
      },
      {
        id: 7,
        name: "Black Beaded Necklace with Carved Pendant",
        image: "black-beaded-necklace.png",
        category: "wearables",
        description: "Terry W"
      },
      {
        id: 8,
        name: "Silver Chain",
        image: "silver-chain.png",
        category: "wearables",
        description: "William Z",
        backText: "I got my first necklace when I was so young that I barely remember what my dad said about it. I remember him telling me to keep it on, so I did. I wore it day and night, taking it off only for things like X-rays. When I got older, I asked him what it meant. He told me it was supposed to bring me luck, protect me, and keep me in good health. As I got older, I started noticing how rarely I got sick, even when I was stressed and barely sleeping. The necklace had gotten me this far, I figured. Why take it off and find out? When I outgrew the first one, my parents gave me a new one. That’s why there are two necklaces. I wear a different one now, but it means the same thing to me."
      },
      {
        id: 9,
        name: "Amethyst Cathedral",
        image: "Amethyst-cathedral.png",
        category: "rituals"
      },
      {
        id: 10,
        name: "Framed Chinese Amber Ornament",
        image: "Framed-Chinese-Amber-Ornament.png",
        category: "rituals"
      },
      { id: 11, name: "Shell", image: "shell.jpg", category: "rituals" },
      { ...fortuneNote, id: 12, category: "rituals" },
      { ...fortuneNote, id: 13, category: "rituals" },
      { ...fortuneNote, id: 14, category: "rituals" },
      { ...fortuneNote, id: 15, category: "rituals" },
      { ...fortuneNote, id: 16, category: "rituals" },
      {
        id: 17,
        name: "Red Pocket",
        image: "Red.png",
        category: "paper",
        description: "Virgil L"
      },
      { ...fortuneNote, id: 18, category: "paper" },
      {
        id: 19,
        name: "Yellow Talisman",
        image: "yellow-tailsman.png",
        category: "paper",
        description: "Nathan J"
      },
      { ...fortuneNote, id: 20, category: "paper" },
      { ...watchPlaceholder, id: 21, category: "paper" },
      { ...clover, id: 22, category: "paper" },
      { ...watchPlaceholder, id: 23, category: "paper" },
      { ...clover, id: 24, category: "paper" },
      {
        id: 25,
        name: "Eggplant Keychain",
        image: "Eggplant-Keychain.png",
        category: "keychains"
      },
      {
        id: 26,
        name: "Pink Plush Bunny Keychain",
        image: "Pink-plush-keychain.png",
        category: "keychains"
      },
      {
        id: 27,
        name: "Red Underwear",
        image: "Red-Underwear.jpg",
        category: "keychains"
      },
      { ...clover, id: 28, category: "keychains" },
      { ...watchPlaceholder, id: 29, category: "keychains" },
      { ...clover, id: 30, category: "keychains" },
      { ...clover, id: 31, category: "keychains" },
      { ...clover, id: 32, category: "keychains" },
      {
        id: 33,
        name: "Lysol Disinfectant Spray",
        image: "Lysol.png",
        category: "found"
      },
      {
        id: 34,
        name: "Light Aqua Blue Helmet",
        image: "Light-aqua-blue-helmet.png",
        category: "found"
      },
      {
        id: 35,
        name: "Yellow Pencil with its Full Eraser",
        image: "yellow-pencil.png",
        category: "found"
      },
      { ...clover, id: 36, category: "found" },
      { ...watchPlaceholder, id: 37, category: "found" },
      { ...clover, id: 38, category: "found" },
      { ...watchPlaceholder, id: 39, category: "found" },
      { ...clover, id: 40, category: "found" },
      {
        id: 41,
        name: "Lysol Disinfectant Spray",
        image: "Lysol.png",
        category: "others"
      },
      {
        id: 42,
        name: "Big Blue Helmet",
        image: "Light-aqua-blue-helmet.png",
        category: "others"
      },
      {
        id: 43,
        name: "Tetronica Pencil with its Full Eraser",
        image: "yellow-pencil.png",
        category: "others"
      },
      { ...clover, id: 44, category: "others" },
      { ...watchPlaceholder, id: 45, category: "others" },
      { ...clover, id: 49, category: "others" },
      { ...watchPlaceholder, id: 46, category: "others" },
      { ...clover, id: 47, category: "others" },
      { ...watchPlaceholder, id: 48, category: "others" }
    ];

    const track = document.getElementById("track");
    const stack = document.getElementById("stack");
    const postcard = document.getElementById("postcard");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const number = document.getElementById("objectNumber");
    const title = document.getElementById("objectTitle");
    const photo = document.getElementById("objectPhoto");
    const caption = document.getElementById("objectCaption");
    const story = document.getElementById("objectStory");
    const storyContent = document.getElementById("storyContent");
    const purchaseLink = document.getElementById("purchaseLink");
    const showStory = document.getElementById("showStory");
    const showObject = document.getElementById("showObject");

    const stepX = 30;
    const stepY = -10;
    const lastIndex = Math.max(0, objects.length - 1);

    let previousTrigger = null;
    let previousOverflow = "";

    function scrollDistance() {
      return Math.max(1, track.offsetHeight - window.innerHeight);
    }

    function updateStack() {
      const progress = Math.min(1, Math.max(0, window.scrollY / scrollDistance()));
      const index = progress * lastIndex;

      stack.style.transform =
        "translate(" + (-index * stepX) + "px, " + (-index * stepY) + "px)";
    }

    function setFace(showingStory) {
      front.hidden = showingStory;
      back.hidden = !showingStory;

      if (postcard.open) {
        (showingStory ? showObject : showStory).focus({ preventScroll: true });
      }
    }

    function showPhoto(object) {
      const fallback = document.createElement("span");
      fallback.textContent = "◇";
      fallback.setAttribute("aria-hidden", "true");
      photo.replaceChildren(fallback);

      if (!object.image) return;

      const img = document.createElement("img");
      img.alt = object.name;
      img.hidden = true;

      img.addEventListener("load", () => {
        fallback.remove();
        img.hidden = false;
      });

      img.addEventListener("error", () => img.remove());
      photo.append(img);
      img.src = "images/" + object.image;
    }

    function updatePurchaseLink(object) {
      purchaseLink.hidden = true;
      purchaseLink.removeAttribute("href");

      if (!object.purchaseUrl) return;

      try {
        const url = new URL(object.purchaseUrl);
        if (!["https:", "http:"].includes(url.protocol)) return;

        purchaseLink.href = url.href;
        purchaseLink.textContent = (object.purchaseLabel || "Visit website") + " ↗";
        purchaseLink.hidden = false;
      } catch {
        // An incomplete URL keeps the link hidden.
      }
    }

    function openObject(object, trigger) {
      previousTrigger = trigger;
      previousOverflow = document.body.style.overflow;

      postcard.style.setProperty("--section-color", colors[object.category] ?? "#fff500");
      number.textContent = "Object " + object.id;
      title.textContent = object.name;
      caption.textContent = object.description ?? "";
      caption.hidden = !caption.textContent;
      story.textContent = object.backText ?? "Personal story";
      showPhoto(object);
      updatePurchaseLink(object);

      setFace(false);
      postcard.showModal();
      document.body.style.overflow = "hidden";
      showStory.focus({ preventScroll: true });
    }

    objects.forEach((object, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "archive-card";
      card.setAttribute("aria-label", "Reveal object " + object.id + ", " + object.name);
      card.setAttribute("aria-haspopup", "dialog");
      card.style.setProperty("--card-x", (index * stepX) + "px");
      card.style.setProperty("--card-y", (index * stepY) + "px");
      card.style.setProperty("--layer", objects.length - index);

      const label = document.createElement("span");
      label.className = "card-number";
      label.textContent = String(object.id).padStart(2, "0");
      label.setAttribute("aria-hidden", "true");
      card.append(label);

      card.addEventListener("click", () => openObject(object, card));
      card.addEventListener("focus", () => {
        if (!card.matches(":focus-visible") || postcard.open) return;

        const bounds = card.getBoundingClientRect();
        if (bounds.left < 0 || bounds.right > window.innerWidth ||
            bounds.top < 0 || bounds.bottom > window.innerHeight) {
          window.scrollTo(0, index / Math.max(1, lastIndex) * scrollDistance());
          updateStack();
        }
      });

      stack.append(card);
    });

    showStory.addEventListener("click", () => {
      setFace(true);
      storyContent.scrollTop = 0;
    });

    showObject.addEventListener("click", () => setFace(false));

    postcard.addEventListener("click", event => {
      if (event.target !== postcard) return;

      const bounds = postcard.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
                      event.clientY < bounds.top || event.clientY > bounds.bottom;

      if (outside) postcard.close();
    });

    postcard.addEventListener("close", () => {
      document.body.style.overflow = previousOverflow;
      previousTrigger?.focus({ preventScroll: true });
    });

    window.addEventListener("scroll", updateStack, { passive: true });
    window.addEventListener("resize", updateStack);
    updateStack();
    postcard.addEventListener("click", (event) => {
  const panel = postcard.querySelector(".postcard-panel");
  if (!postcard.open || !panel) return;

  const { left, right, top, bottom } = panel.getBoundingClientRect();

  if (
    event.clientX < left ||
    event.clientX > right ||
    event.clientY < top ||
    event.clientY > bottom
  ) {
    postcard.close();
  }
});
  </script>
</body>
</html>
