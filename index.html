
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Price of Luck</title>

<style>
* { box-sizing: border-box; }

html { scroll-behavior: auto; }

body {
  margin: 0;
  background: #faf9f6;
  color: #191919;
  font-family: Arial, Helvetica, sans-serif;
}

button, a { font: inherit; }

a { color: inherit; text-decoration: none; }

/* Header */

header {
  position: fixed;
  top: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 20;
  pointer-events: none;
}

header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: -.03em;
  text-transform: lowercase;
}

/* Left introduction */

.intro {
  position: fixed;
  left: 34px;
  top: 43%;
  width: 190px;
  z-index: 20;
  pointer-events: none;
}

.intro .eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.intro p {
  font-size: 12px;
  line-height: 1.6;
  color: #666;
}

/* Right navigation */

.categories {
  position: fixed;
  right: 34px;
  top: 85%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 13px;
}

.categories a {
  color: #b8b8b8;
  font-size: 14px;
  transition: color .25s ease;
}

.categories a:hover,
.categories a:focus-visible {
  color: #000;
}

.categories a:first-child { color: #000; }

/* Scrollable archive */

.scroll-track {
  position: relative;
  height: 750vh;
}

.scene {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  perspective: 1600px;
}

.archive {
  position: absolute;
  top: 46%;
  left: 54%;
  width: 1px;
  height: 1px;
  transform-style: preserve-3d;
}

.archive-line {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.archive-card {
  position: absolute;
  left: 0;
  top: 0;
  width: 210px;
  height: 290px;
  padding: 0;
  border: 1px solid #f8f8f8;
  background: white;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.3s ease-out;
  backface-visibility: visible;
  box-shadow: 1px 2px 5px #0000000b;
}

.archive-card .picture {
  width: 100%;
  height: 82%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 64px;
  overflow: hidden;
}

.archive-card .picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.archive-card .label {
  height: 18%;
  background: #f7f6f3;
  padding: 9px;
  text-align: left;
  font-size: 9px;
}

.archive-card:hover {
  filter: brightness(.94);
}

.scroll-hint {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: .08em;
  color: #777;
  z-index: 20;
  pointer-events: none;
}

/* Floating selected card */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #faf9f675;
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s, visibility .35s;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

.selected-card {
  width: min(360px, 85vw);
  max-height: 88vh;
  background: #fff;
  box-shadow: 0 15px 65px #00000022;
  overflow-y: auto;
  transform: translateY(22px) scale(.94);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}

.overlay.active .selected-card {
  transform: translateY(0) scale(1);
}

.selected-image {
  height: min(55vh, 460px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 105px;
}

.selected-info {
  padding: 18px 20px 20px;
}

.selected-number {
  color: #999;
  font-size: 10px;
  letter-spacing: .08em;
}

.selected-info h2 {
  font-size: 19px;
  font-weight: 400;
  margin: 12px 0;
}

.selected-info p {
  font-size: 12px;
  line-height: 1.6;
  color: #666;
  margin: 0;
}

@media (max-width: 700px) {
  .intro { left: 15px; top: 90px; width: 140px; }
  .categories { right: 15px; gap: 10px; }
  .categories a { font-size: 11px; }
  .archive-card { width: 170px; height: 235px; }
}
</style>
</head>

<body>

<header>
  <h1>The price of luck</h1>
</header>

<aside class="intro">
  <div class="eyebrow">About the Archive</div>
  <p>
    An collection of objects believed
    to carry luck, protection, and personal meaning.
  </p>
</aside>

<nav class="categories">
  <a href="category.html?category=all">All Objects</a>
  <a href="category.html?category=keepsakes">Keepsakes</a>
  <a href="category.html?category=charms">Charms</a>
  <a href="category.html?category=rituals">Rituals</a>
  <a href="category.html?category=gifts">Gifts</a>
  <a href="category.html?category=found">Found Objects</a>
  <a href="category.html?category=memories">Memories</a>
</nav>

<div class="scroll-track" id="track">
  <div class="scene">
    <div class="archive">
      <div class="archive-line" id="archiveLine"></div>
    </div>
  </div>
</div>

<div class="scroll-hint">SCROLL TO EXPLORE ↕</div>

<div class="overlay" id="overlay">
  <article class="selected-card" id="selectedCard">
    <div class="selected-image" id="selectedImage"></div>
    <div class="selected-info">
      <div class="selected-number" id="selectedNumber"></div>
      <h2 id="selectedTitle"></h2>
      <p id="selectedDescription"></p>
    </div>
  </article>
</div>

<script>
const names = [
  "Lucky Coin", "Red Thread", "Old Photograph",
  "Four-Leaf Clover", "Silver Ring", "Lucky Key",
  "Small Stone", "Paper Crane", "Family Bracelet",
  "Wishing Star", "Shell", "Fortune Note"
];

const symbols = [
  "◉", "〰", "▣", "✳", "◌", "⚿",
  "●", "◇", "◎", "✦", "◔", "✉"
];

const colors = [
  "#b6aa97", "#bd7770", "#a6ada3", "#b9bd96",
  "#b9b9b5", "#b4a389", "#a5aaa9", "#c5b4a4",
  "#b9a5a1", "#c7b69b", "#a6b9b7", "#d0c4aa"
];

const categories = [
  "keepsakes", "charms", "memories",
  "charms", "gifts", "found",
  "found", "rituals", "gifts",
  "rituals", "found", "memories"
];

const objects = Array.from({ length: 48 }, (_, i) => ({
  id: i + 1,
  name: names[i % names.length],
  symbol: symbols[i % symbols.length],
  color: colors[i % colors.length],
  category: categories[i % categories.length],
  description:
    "This object is kept as a reminder of an important moment. " +
    "Its monetary value may be small, but its personal significance " +
    "is difficult to measure."
}));

const archiveLine = document.getElementById("archiveLine");
const track = document.getElementById("track");
const overlay = document.getElementById("overlay");
const selectedCard = document.getElementById("selectedCard");

const STEP = 28;
const ANGLE = -20 * Math.PI / 180;
const dx = Math.cos(ANGLE);
const dy = Math.sin(ANGLE);

objects.forEach((obj, i) => {
  const card = document.createElement("button");
  card.className = "archive-card";
  card.type = "button";
  card.setAttribute("aria-label", "View " + obj.name);

  const x = i * STEP * dx;
const y = i * STEP * dy;

card.style.transform = `
  translate3d(${x}px, ${y}px, 0)
  rotateY(-25deg)
`;

card.addEventListener("mouseenter", () => {
  card.style.transform = `
    translate3d(${x}px, ${y - 35}px, 0)
    rotateY(-25deg)
  `;
});

card.addEventListener("mouseleave", () => {
  card.style.transform = `
    translate3d(${x}px, ${y}px, 0)
    rotateY(-25deg)
  `;
});
  card.innerHTML = `
    <div class="picture" style="background:${obj.color}">
      ${obj.symbol}
    </div>
    <div class="label">
      OBJECT ${String(obj.id).padStart(3, "0")}
    </div>
  `;

  card.addEventListener("click", () => openCard(obj));
  archiveLine.appendChild(card);
});

/* Smooth diagonal movement */

let current = 0;
let target = 0;

function updateTarget() {
  const maxScroll = track.offsetHeight - window.innerHeight;
  const progress = maxScroll > 0
    ? Math.min(1, Math.max(0, window.scrollY / maxScroll))
    : 0;

  const total = (objects.length - 1) * STEP;

  target = -progress * total;
}

function animate() {
  current += (target - current) * 0.085;

  const total = (objects.length - 1) * STEP;

  // Keep the visible section near the screen center.
  const offset = total * 0.22 + current;

  archiveLine.style.transform = `
    translate3d(
      ${offset * dx}px,
      ${offset * dy}px,
      0
    )
  `;

  requestAnimationFrame(animate);
}

window.addEventListener("scroll", updateTarget, { passive: true });
window.addEventListener("resize", updateTarget);

updateTarget();
animate();

/* Card preview */

function openCard(obj) {
  document.getElementById("selectedImage").style.background = obj.color;
  document.getElementById("selectedImage").textContent = obj.symbol;
  document.getElementById("selectedNumber").textContent =
    "ARCHIVE / " + String(obj.id).padStart(3, "0");
  document.getElementById("selectedTitle").textContent = obj.name;
  document.getElementById("selectedDescription").textContent =
    obj.description;

  overlay.classList.add("active");
}

function closeCard() {
  overlay.classList.remove("active");
}

overlay.addEventListener("click", closeCard);

selectedCard.addEventListener("click", e => {
  e.stopPropagation();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeCard();
});
</script>

</body>
</html>
