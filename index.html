    }

    .site-title,
    .instructions,
    .archive-about,
    .object-title,
    .caption,
    .story-text,
    .flip-button {
      font-family: "neue-haas-grotesk-display", Arial, sans-serif;
    }   
    .page-background {
  position: fixed;
  inset: 0;
  background: #555 url("images/rainbow-1.jpg") center / cover no-repeat;
  pointer-events: none;
}

.rainbow-layer {
  position: absolute;
  inset: 0;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 3s ease-in-out;
}

.rainbow-layer.is-visible {
  opacity: 1;
}

    .site-title,
    .instructions {
      position: fixed;
      z-index: 2;
      left: 16px;
      right: 16px;
      margin: 0;
      color: white;
      text-shadow: 0 1px 5px black, 0 0 12px black;
      text-align: center;
      pointer-events: none;
    }

    .site-title {
      top: 24px;
      font: 28px Georgia, serif;
    }

    .instructions {
      bottom: 24px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .scroll-track {
      position: relative;
      height: 350vh;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .stack {
      --card-width: clamp(150px, 36vw, 210px);
      --card-height: clamp(210px, 50vw, 290px);
      position: absolute;
      top: calc(50% - var(--card-height) / 2);
      left: calc(50% - var(--card-width) / 2);
      width: var(--card-width);
      height: var(--card-height);
    }

    .archive-card {
      position: absolute;
      inset: 0;
      z-index: var(--layer);
      transform: translate(var(--card-x), var(--card-y)) skewY(-8deg);
      border: 2px solid white;
      box-shadow: 0 0 0 1px #191919, 2px 3px 0 #191919;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      z-index: 100;
      border-color: #fff500;
      transform:
        translate(var(--card-x), calc(var(--card-y) - 16px))
        skewY(-8deg);
    }

    .archive-card:focus-visible {
      outline: 2px solid #191919;
      outline-offset: 3px;
    }

    .card-number {
      position: absolute;
      right: 3px;
      bottom: 6px;
      padding: 3px;
      background: #191919;
      color: white;
      font: 11px / 1 Arial, sans-serif;
    }

    .postcard {
      width: min(380px, calc(100vw - 32px));
      height: min(570px, calc(100dvh - 32px));
      max-height: none;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: white;
      color: #191919;
    }

    .postcard::backdrop {
      background: rgb(0 0 0 / 65%);
    }

    .front,
    .back {
      height: 100%;
    }

    [hidden] {
      display: none !important;
    }

    .front {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      text-align: center;
    }

    .object-heading,
    .back {
      background: var(--section-color, #fff500);
    }

    .object-heading {
      padding: 14px 16px;
    }

    .object-number {
      font-size: 11px;
      letter-spacing: .08em;
    }

    .object-title {
      margin: 5px 0 0;
      font: normal clamp(22px, 5vw, 32px) / 1.05 Georgia, serif;
    }

    .object-photo {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      margin: 16px 14%;
      border-inline: 2px solid #ff0098;
      font-size: 48px;
    }

    .object-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      margin: 0;
      padding: 0 16px 10px;
      font: 17px Georgia, serif;
    }

    .back {
      display: flex;
      flex-direction: column;
    }

    .story-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
      padding: 28px;
    }

    .story-text {
      margin: auto 0;
      font: 18px / 1.45 Georgia, serif;
      white-space: pre-wrap;
    }

    .purchase-link {
      display: inline-block;
      align-self: flex-start;
      margin-top: 16px;
      color: inherit;
      font-size: 13px;
    }

    .flip-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-top: 1px solid rgb(0 0 0 / 20%);
      background: transparent;
      color: inherit;
      font: 12px Arial, sans-serif;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .archive-card {
        transition: none;
      }
    }
    .archive-about {
  position: fixed;
  z-index: 3;
  top: 43%;
  left: 24px;
  width: min(190px, calc(100% - 48px));
  padding: 12px 14px;
  color: white;
  pointer-events: none;
}

.archive-about h2 {
  margin: 0 0 6px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.archive-about p {
  margin: 0;
  font-size: 13px;
  line-height: 1.45;
}

@media (max-width: 700px) {
  .archive-about {
    top: 68px;
    left: 16px;
    width: min(260px, calc(100% - 32px));
  }

#downloadList {

    const track = document.getElementById("track");
    const stack = document.getElementById("stack");
    const postcard = document.getElementById("postcard");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const number = document.getElementById("objectNumber");
    const title = document.getElementById("objectTitle");
    const photo = document.getElementById("objectPhoto");
    const caption = document.getElementById("objectCaption");
    const story = document.getElementById("objectStory");
    const storyContent = document.getElementById("storyContent");
    const purchaseLink = document.getElementById("purchaseLink");
    const showStory = document.getElementById("showStory");
    const showObject = document.getElementById("showObject");

    const stepX = 30;
    const stepY = -10;
    const lastIndex = Math.max(0, objects.length - 1);

    let previousTrigger = null;
    let previousOverflow = "";

    function scrollDistance() {
      return Math.max(1, track.offsetHeight - window.innerHeight);
    }

    function updateStack() {
      const progress = Math.min(1, Math.max(0, window.scrollY / scrollDistance()));
      const index = progress * lastIndex;

      stack.style.transform =
        "translate(" + (-index * stepX) + "px, " + (-index * stepY) + "px)";
    }

    function setFace(showingStory) {
      front.hidden = showingStory;
      back.hidden = !showingStory;

      if (postcard.open) {
        (showingStory ? showObject : showStory).focus({ preventScroll: true });
      }
    }

    function showPhoto(object) {
      const fallback = document.createElement("span");
      fallback.textContent = "◇";
      fallback.setAttribute("aria-hidden", "true");
      photo.replaceChildren(fallback);

      if (!object.image) return;

      const img = document.createElement("img");
      img.alt = object.name;
      img.hidden = true;

      img.addEventListener("load", () => {
        fallback.remove();
        img.hidden = false;
      });

      img.addEventListener("error", () => img.remove());
      photo.append(img);
      img.src = "images/" + object.image;
    }

    function updatePurchaseLink(object) {
      purchaseLink.hidden = true;
      purchaseLink.removeAttribute("href");

      if (!object.purchaseUrl) return;

      try {
        const url = new URL(object.purchaseUrl);
        if (!["https:", "http:"].includes(url.protocol)) return;

        purchaseLink.href = url.href;
        purchaseLink.textContent = (object.purchaseLabel || "Visit website") + " ↗";
        purchaseLink.hidden = false;
      } catch {
        // An incomplete URL keeps the link hidden.
      }
    }

    function openObject(object, trigger) {
      previousTrigger = trigger;
      previousOverflow = document.body.style.overflow;

      postcard.style.setProperty("--section-color", colors[object.category] ?? "#fff500");
      number.textContent = "Object " + object.id;
      title.textContent = object.name;
      caption.textContent = object.description ?? "";
      caption.hidden = !caption.textContent;
      story.textContent = object.backText ?? "Personal story";
      showPhoto(object);
      updatePurchaseLink(object);

      setFace(false);
      postcard.showModal();
      document.body.style.overflow = "hidden";
      showStory.focus({ preventScroll: true });
    }

    objects.forEach((object, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "archive-card";
      card.setAttribute("aria-label", "Reveal object " + object.id + ", " + object.name);
      card.setAttribute("aria-haspopup", "dialog");
      card.style.setProperty("--card-x", (index * stepX) + "px");
      card.style.setProperty("--card-y", (index * stepY) + "px");
      card.style.setProperty("--layer", objects.length - index);

      const label = document.createElement("span");
      label.className = "card-number";
      label.textContent = String(object.id).padStart(2, "0");
      label.setAttribute("aria-hidden", "true");
      card.append(label);

      card.dataset.objectId = String(object.id);

card.addEventListener("click", () => {
  if (selectingPostcards) {
    togglePostcardSelection(object, card);
  } else {
    openObject(object, card);
  }
});
      card.addEventListener("focus", () => {
        if (!card.matches(":focus-visible") || postcard.open) return;

        const bounds = card.getBoundingClientRect();
        if (bounds.left < 0 || bounds.right > window.innerWidth ||
            bounds.top < 0 || bounds.bottom > window.innerHeight) {
          window.scrollTo(0, index / Math.max(1, lastIndex) * scrollDistance());
          updateStack();

postcard.addEventListener("click", (event) => {
  if (event.target !== postcard) return;

  const bounds = postcard.getBoundingClientRect();
  const clickedOutside =
    event.clientX < bounds.left ||
    event.clientX > bounds.right ||
    event.clientY < bounds.top ||
    event.clientY > bounds.bottom;

  if (clickedOutside) {
    postcard.close();
  }
});

postcard.addEventListener("close", () => {
  document.body.style.overflow = previousOverflow;

  const card = previousTrigger;
  if (!card) return;

  const object = objects.find(item => String(item.id) === card.dataset.objectId);

  if (object?.image && !card.querySelector(".stack-artwork")) {
    const artwork = document.createElement("img");
    artwork.className = "stack-artwork";
    artwork.alt = "";
    artwork.hidden = true;

    Object.assign(artwork.style, {
      position: "absolute",
      inset: "0",
      width: "100%",
      height: "100%",
      objectFit: "cover",
      pointerEvents: "none"
    });

    artwork.addEventListener("load", () => {
      artwork.hidden = false;
    }, { once: true });

    artwork.addEventListener("error", () => {
      artwork.remove();
    }, { once: true });

    // Place the image behind the card number and inside the existing border.
    card.prepend(artwork);
    artwork.src = object.image.startsWith("images/")
      ? object.image
      : `images/${object.image}`;
  }

  card.focus({ preventScroll: true });
});

function togglePostcardSelection(object, card) {
  const selected = !selectedPostcardIds.has(object.id);

  if (selected) {
    selectedPostcardIds.add(object.id);
  } else {
    selectedPostcardIds.delete(object.id);

  card.classList.toggle("is-selected", selected);
  card.setAttribute("aria-pressed", String(selected));

}

async function loadPostcardPhoto(path) {
  if (!path) return null;

  const image = new Image();
  image.src = path.startsWith("images/") ? path : `images/${path}`;

  try {
    await image.decode();
    return image;
  } catch {
    return null;
  }
}

function drawWrappedText(context, text, x, y, width, lineHeight, draw = true) {
  let top = y;

  for (const paragraph of String(text).split("\n")) {
    let line = "";

    for (const word of paragraph.split(/\s+/)) {
      const nextLine = line ? `${line} ${word}` : word;

      if (line && context.measureText(nextLine).width > width) {
        if (draw) context.fillText(line, x, top);
        top += lineHeight;
        line = word;
      } else {
        line = nextLine;
      }
    }

    if (draw) context.fillText(line, x, top);
    top += lineHeight;
  }

  return top - y;
}

async function makePostcardPng(object, side, image) {
  const canvas = document.createElement("canvas");
  canvas.width = 900;
  canvas.height = 1350;

  const ctx = canvas.getContext("2d");
  const color = colors[object.category] ?? "#fff500";
  const ink = "#191919";
  const margin = 72;
  const right = 828;
  const width = right - margin;
  const number = String(object.id).padStart(2, "0");

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, 900, 1350);

  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 900, 18);

  ctx.fillStyle = ink;
  ctx.textBaseline = "top";
  ctx.font = "22px Georgia";
  ctx.fillText("The Price of Luck", margin, 64);

  ctx.textAlign = "right";
  ctx.fillText(`No. ${number}`, right, 64);
  ctx.textAlign = "left";

  function drawRule(y) {
    ctx.fillStyle = ink;
    ctx.fillRect(margin, y, width, 1);
  }

  function drawFittedText(text, y, maxHeight, startSize, leading, weight = "") {
    let size = startSize;
    let lineHeight;
    let height;

    do {
      ctx.font = `${weight ? weight + " " : ""}${size}px Georgia`;
      lineHeight = Math.ceil(size * leading);
      height = drawWrappedText(ctx, text, margin, 0, width, lineHeight, false);
      if (height <= maxHeight || size <= 1) break;
      size--;
    } while (true);

    drawWrappedText(ctx, text, canvas.width / 2, y, width, lineHeight);
return height;
  }

  drawRule(108);
ctx.textAlign = "center";
  if (side === "front") {
    if (image) {
      const scale = Math.min(width / image.naturalWidth, 790 / image.naturalHeight);
      const photoWidth = image.naturalWidth * scale;
      const photoHeight = image.naturalHeight * scale;

      ctx.drawImage(
        image,
        (900 - photoWidth) / 2,
        145 + (790 - photoHeight) / 2,
        photoWidth,
        photoHeight
      );
    }

    const titleY = 980;
const titleHeight = drawFittedText(object.name, titleY, 130, 46, 1.1);

if (object.description) {
  ctx.fillStyle = "#555";
  drawFittedText(object.description, titleY + titleHeight + 8, 68, 23, 1.25);
} {
      ctx.fillStyle = "#555";
      drawFittedText(object.description, 1033 + titleHeight, 74, 28, 1.25);
    }
  } else {
    ctx.font = "italic 26px Georgia";
    ctx.fillText("The story behind it", margin, 154);

    const titleHeight = drawFittedText(object.name, 205, 160, 52, 1.12);
    const storyTop = 205 + titleHeight + 50;
    const story = object.backText ?? object.backtxt ?? "";

    drawFittedText(story, storyTop, 1190 - storyTop, 37, 1.45);
    drawRule(1230);

    if (object.description) {
      ctx.fillStyle = "#555";
      drawFittedText(object.description, 1252, 50, 24, 1.2);
    }
  }

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("Could not create a postcard image."));
    }, "image/png");
  });
  ctx.fillText("The story behind it", canvas.width / 2, 154);
}
savePostcardsButton.addEventListener("click", async () => {
  const selected = objects.filter(object => selectedPostcardIds.has(object.id));
  if (!selected.length) return;

  const Pdf = window.jspdf?.jsPDF;
  if (!Pdf) {
    alert("The PDF library couldn’t load. Check your internet connection and refresh.");
    return;
  }

  const pageWidth = 4;
  const pageHeight = 6;
  const pixelsPerInch = 300;

  savePostcardsButton.disabled = true;
  selectPostcardsButton.disabled = true;

  try {
    const pdf = new Pdf({
      orientation: "portrait",
      unit: "in",
      format: [pageWidth, pageHeight],
      compress: true
    });

    const canvas = document.createElement("canvas");
    canvas.width = pageWidth * pixelsPerInch;
    canvas.height = pageHeight * pixelsPerInch;
    const context = canvas.getContext("2d");
    let pageCount = 0;

    for (const [index, object] of selected.entries()) {
      savePostcardsButton.textContent = `Preparing ${index + 1} of ${selected.length}…`;

      for (const [side, filename] of [
        ["front", object.image],
        ["back", object.backImage]
      ]) {
        if (!filename) {
          throw new Error(`${object.name} is missing its ${side} image filename.`);
        }

        const artwork = new Image();
        artwork.src = filename.startsWith("images/")
          ? filename
          : `images/${filename}`;

        try {
          await artwork.decode();
        } catch {
          throw new Error(`Couldn’t load the ${side} of ${object.name}. Check "${filename}".`);
        }

        // Match the centered object-fit: cover used on the opened postcard.
        const scale = Math.max(
          canvas.width / artwork.naturalWidth,
          canvas.height / artwork.naturalHeight
        );
        const width = artwork.naturalWidth * scale;
        const height = artwork.naturalHeight * scale;

        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(
          artwork,
          (canvas.width - width) / 2,
          (canvas.height - height) / 2,
          width,
          height
        );

        if (pageCount > 0) pdf.addPage([pageWidth, pageHeight], "portrait");

        pdf.addImage(
          canvas.toDataURL("image/png"),
          "PNG",
          0,
          0,
          pageWidth,
          pageHeight
        );
        pageCount++;
      }
    }

    const preview = document.getElementById("pdfPreview");
const frame = document.getElementById("pdfPreviewFrame");
const openLink = document.getElementById("openPdfPreview");
const downloadLink = document.getElementById("downloadPdf");

const previousUrl = downloadLink.getAttribute("href");
const previewUrl = URL.createObjectURL(pdf.output("blob"));

frame.src = previewUrl;
openLink.href = previewUrl;
downloadLink.href = previewUrl;

if (previousUrl) URL.revokeObjectURL(previousUrl);

preview.showModal();
  } catch (error) {
    alert(error.message || "The postcard PDF couldn’t be created.");
  } finally {
    selectPostcardsButton.disabled = false;
    updateSelectionCount();
  }
});

  <script>
  const rainbowPhotos = [
    "images/rainbow1.jpeg",
    "images/rainbow2.jpeg",
    "images/rainbow3.jpeg",
    "images/rainbow4.jpeg",
    "images/rainbow5.jpeg",
  ];

  const rainbowLayers = document.querySelectorAll(".rainbow-layer");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const holdTime = 8000;
  const fadeTime = 5000;

  let currentPhoto = 0;
  let visibleLayer = rainbowLayers[0];
  let nextLayer = rainbowLayers[1];

  visibleLayer.style.backgroundImage = `url("${rainbowPhotos[0]}")`;

  async function changeRainbow() {
    if (reduceMotion.matches || rainbowPhotos.length < 2) return;

    currentPhoto = (currentPhoto + 1) % rainbowPhotos.length;
    const path = rainbowPhotos[currentPhoto];

    // Wait for the next photo to load before starting the fade.
    const photo = new Image();
    photo.src = path;

    try {
      await photo.decode();
    } catch {
      setTimeout(changeRainbow, holdTime);
      return;
    }

    if (reduceMotion.matches) return;

    nextLayer.style.backgroundImage = `url("${path}")`;
    nextLayer.style.zIndex = "1";
    nextLayer.classList.add("is-visible");

    setTimeout(() => {
      visibleLayer.classList.remove("is-visible");
      visibleLayer.style.zIndex = "0";

      [visibleLayer, nextLayer] = [nextLayer, visibleLayer];
      setTimeout(changeRainbow, holdTime);
    }, fadeTime);
  }

  setTimeout(changeRainbow, holdTime);
</script>
