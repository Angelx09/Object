body {

  background-attachment: fixed;
  color: #191919;

button,
a {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

/* HEADER */

header {
  position: fixed;
  top: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 20;
  pointer-events: none;
}

header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: -.03em;
  text-transform: lowercase;
}

/* INTRODUCTION */

.intro {
  position: fixed;
  left: 34px;
  top: 43%;
  width: 190px;
  z-index: 20;
  pointer-events: none;
}

.eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.intro p {
  font-size: 12px;
  line-height: 1.6;
  color: #fffee5;
}

/* CATEGORY NAVIGATION */

.categories {
  position: fixed;
  right: 34px;
  top: 85%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 13px;
}

.categories a {
  color: #b8b8b8;
  font-size: 14px;
  transition: color .25s ease;
}

.categories a:hover,
.categories a:focus-visible,
.categories a:first-child {
  color: #000;
}

/* ARCHIVE */

.scroll-track {
  position: relative;
  height: 350vh;
}

.scene {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  perspective: 1600px;
}

.archive {
  position: absolute;
  top: 46%;
  left: 54%;
  width: 1px;
  height: 1px;
  transform-style: preserve-3d;
}

.archive-line {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.archive-card {
  position: absolute;
  left: 0;
  top: 0;
  width: 210px;
  height: 290px;
  padding: 0;
  border: 1px solid #f8f8f8;
  background: #fff;
  color: inherit;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .3s ease-out;
  box-shadow: 1px 2px 5px #0000000b;
}

.archive-card:focus-visible {
  outline: 2px solid #191919;
  outline-offset: 4px;
}

.picture {
  width: 100%;
  height: 82%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 64px;
  overflow: hidden;
}

.picture img,
.selected-image img {
  width: 100%;
  height: 100%;
  display: block;

  /* Use "contain" to show the entire photo without cropping. */
  object-fit: cover;
}

.label {
  height: 18%;
  background: #f7f6f3;
  padding: 9px;
  text-align: left;
  font-size: 9px;
}

.label-name {
  display: block;
  margin-top: 5px;
  color: #777;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scroll-hint {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: .08em;
  color: #777;
  z-index: 20;
  pointer-events: none;
}

/* OVERLAY */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #faf9f675;
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s, visibility .35s;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

.selected-card {
  width: min(360px, 85vw);
  height: min(650px, 88vh);
  perspective: 1400px;
  transform: translateY(22px) scale(.94);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}

.selected-card:focus {
  outline: none;
}

.overlay.active .selected-card {
  transform: translateY(0) scale(1);
}

/* FLIPPING CARD */

.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .75s cubic-bezier(.2,.75,.2,1);
}

.flip-inner.is-flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: 0 15px 65px #00000022;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  cursor: pointer;
}

.card-front {
  transform: rotateY(0deg);
}

.selected-image {
  height: 65%;
  flex: 0 0 65%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 105px;
  overflow: hidden;
}

.selected-info {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 20px;
}

.selected-number {
  color: #999;
  font-size: 10px;
  letter-spacing: .08em;
}

.selected-info h2 {
  font-size: 19px;
  font-weight: 400;
  margin: 12px 0;
}

.selected-info p {
  font-size: 12px;
  line-height: 1.6;
  color: #666;
  margin: 0;
}

.flip-button {
  flex-shrink: 0;
  width: 100%;
  padding: 13px 20px;
  border: 0;
  border-top: 1px solid #00000010;
  background: transparent;
  color: #888;
  text-align: left;
  font-size: 10px;
  cursor: pointer;
}

.flip-button:focus-visible,
.purchase-link:focus-visible {
  outline: 2px solid #191919;
  outline-offset: -3px;
}

/* BACK OF CARD */

.card-back {
  transform: rotateY(180deg);
  background: #f1eee7;
  padding: 26px;
}

.back-eyebrow {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #777;
}

.back-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  overflow-y: auto;
}

.back-content h2 {
  margin: 14px 0;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: -.04em;
}

.back-content p {
  margin: 0;
  font-size: 12px;
  line-height: 1.7;
  color: #777;
}

.purchase-link {
  display: inline-block;
  margin-top: 28px;
  padding-bottom: 5px;
  border-bottom: 1px solid #191919;
  font-size: 13px;
  transition: opacity .2s;
}

.purchase-link:hover {
  opacity: .55;
}

.purchase-link[hidden] {
  display: none;
}

.card-back .flip-button {
  padding-left: 0;
  padding-right: 0;
}

/* MOBILE */

@media (max-width: 700px) {
  .intro {
    left: 15px;
    top: 90px;
    width: 140px;
  }

  .categories {
    right: 15px;
    gap: 10px;
  }

  .categories a {
    font-size: 11px;
  }

  .archive-card {
    width: 170px;
    height: 235px;
  }

  .archive {
    left: 50%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .archive-card,
  .overlay,
  .selected-card,
  .flip-inner {
    transition: none;
  }
}

/* ELEMENTS */

const pageContent = document.getElementById("pageContent");
const archiveLine = document.getElementById("archiveLine");
const track = document.getElementById("track");
const overlay = document.getElementById("overlay");
const selectedCard = document.getElementById("selectedCard");
const flipInner = document.getElementById("flipInner");
const cardFront = document.getElementById("cardFront");
const cardBack = document.getElementById("cardBack");
const showBack = document.getElementById("showBack");
const showFront = document.getElementById("showFront");
const purchaseLink = document.getElementById("purchaseLink");

const STEP = 28;
const ANGLE = -20 * Math.PI / 180;
const dx = Math.cos(ANGLE);
const dy = Math.sin(ANGLE);

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);

let previousFocus = null;
let previousOverflow = "";
let isFlipped = false;

/* PHOTO WITH PLACEHOLDER FALLBACK */

function showImage(container, obj) {
  container.replaceChildren();
  container.style.backgroundColor = obj.color;

  const fallback = document.createElement("span");
  fallback.textContent = obj.symbol;
  fallback.setAttribute("aria-hidden", "true");
  container.appendChild(fallback);

  if (!obj.image) return;

  const img = document.createElement("img");
  img.alt = obj.name;
  img.style.display = "none";

  img.addEventListener("load", () => {
    fallback.remove();
    img.style.display = "block";
  });

  img.addEventListener("error", () => {
    img.remove();
  });

  container.appendChild(img);
  img.src = obj.image;
}

/* BUILD CARDS — NO REPEATING */

objects.forEach((obj, i) => {
  const card = document.createElement("button");
  card.className = "archive-card";
  card.type = "button";
  card.setAttribute("aria-label", "View " + obj.name);

  const x = i * STEP * dx;
  const y = i * STEP * dy;

  function positionCard(raised) {
    card.style.transform = `
      translate3d(${x}px, ${y - (raised ? 35 : 0)}px, 0)
      rotateY(-25deg)
    `;
  }

  positionCard(false);

  card.addEventListener("mouseenter", () => positionCard(true));

  card.addEventListener("mouseleave", () => {
    positionCard(document.activeElement === card);
  });

  card.addEventListener("focus", () => positionCard(true));
  card.addEventListener("blur", () => positionCard(false));

  const heading = document.createElement("div");
heading.className = "stack-heading";
heading.style.backgroundColor = getGroupColor(i);

const number = document.createElement("div");
number.textContent = "Object " + obj.id;

const title = document.createElement("div");
title.textContent = obj.name;

heading.append(number, title);

const imageArea = document.createElement("div");
imageArea.className = "stack-image-area";

const brackets = document.createElement("div");
brackets.className = "stack-brackets";

const picture = document.createElement("div");
picture.className = "picture";
showImage(picture, obj);

brackets.appendChild(picture);
imageArea.appendChild(brackets);

const caption = document.createElement("div");
caption.className = "stack-caption";
caption.textContent = obj.description;

card.append(heading, imageArea, caption);

  card.addEventListener("click", () => openCard(obj, card));

  archiveLine.appendChild(card);
});

/* SCROLL MOVEMENT */

let current = 0;
let target = 0;

function updateTarget() {
  const maxScroll = track.offsetHeight - window.innerHeight;

  const progress = maxScroll > 0
    ? Math.min(
        1,
        Math.max(
          0,
          (window.scrollY - track.offsetTop) / maxScroll
        )
      )
    : 0;

  const total = Math.max(0, objects.length - 1) * STEP;
  target = -progress * total;
}

function animate() {
  current = reducedMotion.matches
    ? target
    : current + (target - current) * .085;

  const mobile = window.innerWidth <= 700;
  const cardWidth = mobile ? 170 : 210;
  const cardHeight = mobile ? 235 : 290;

  archiveLine.style.transform = `
    translate3d(
      ${current * dx - cardWidth / 2}px,
      ${current * dy - cardHeight / 2}px,
      0
    )
  `;

  requestAnimationFrame(animate);
}

window.addEventListener("scroll", updateTarget, { passive: true });
window.addEventListener("resize", updateTarget);

updateTarget();
animate();

/* FLIP THE ENLARGED CARD */

function setFlipped(flipped, moveFocus = true) {
  isFlipped = flipped;

  flipInner.classList.toggle("is-flipped", flipped);

  // Move focus before hiding the previous face.
  if (moveFocus) {
    const nextFace = flipped ? cardBack : cardFront;
    nextFace.inert = false;
    nextFace.setAttribute("aria-hidden", "false");

    const button = flipped ? showFront : showBack;
    button.focus({ preventScroll: true });
  }

  cardFront.inert = flipped;
  cardBack.inert = !flipped;

  cardFront.setAttribute("aria-hidden", String(flipped));
  cardBack.setAttribute("aria-hidden", String(!flipped));
}

/* VALIDATE PURCHASE LINKS */

function validPurchaseUrl(value) {
  if (!value) return "";

  try {
    const url = new URL(value);

    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch {
    return "";
  }
}

/* OPEN CARD */

function openCard(obj, trigger) {
  const objectIndex = objects.findIndex(item => item.id === obj.id);
const groupColor = getGroupColor(objectIndex);

document.querySelector(".object-heading").style.backgroundColor =
  groupColor;

document.getElementById("cardBack").style.backgroundColor =
  groupColor;
  previousFocus = trigger;
  previousOverflow = document.body.style.overflow;

  // Reset to the front without a reverse flip animation.
  flipInner.style.transition = "none";
  setFlipped(false, false);
  void flipInner.offsetWidth;
  flipInner.style.transition = "";

  showImage(document.getElementById("selectedImage"), obj);

  const number =
    "ARCHIVE / " + String(obj.id).padStart(3, "0");

  document.getElementById("selectedNumber").textContent = "Object " + obj.id;
  document.getElementById("backNumber").textContent = number;
  document.getElementById("selectedTitle").textContent = obj.name;
  document.getElementById("backTitle").textContent = obj.name;

  document.getElementById("selectedDescription").textContent =
    obj.description;

  const url = validPurchaseUrl(obj.purchaseUrl);
  const message = document.getElementById("purchaseMessage");

  if (url) {
    purchaseLink.href = url;
    purchaseLink.textContent =
      (obj.purchaseLabel || "Visit website") + " ↗";
    purchaseLink.hidden = false;

    message.textContent =
      "Visit the website below to view this object.";
  } else {
    purchaseLink.removeAttribute("href");
    purchaseLink.hidden = true;

    message.textContent =
      "No purchase link has been added for this object.";
  }

  cardFront.querySelector(".selected-info").scrollTop = 0;

  overlay.inert = false;
  overlay.setAttribute("aria-hidden", "false");
  overlay.classList.add("active");

  document.body.style.overflow = "hidden";
  showBack.focus({ preventScroll: true });
  pageContent.inert = true;
}

/* CLOSE CARD */

function closeCard() {
  if (!overlay.classList.contains("active")) return;

  pageContent.inert = false;
  document.body.style.overflow = previousOverflow;

  previousFocus?.focus({ preventScroll: true });

  overlay.classList.remove("active");
  overlay.setAttribute("aria-hidden", "true");
  overlay.inert = true;
}

/* CLICK ENLARGED CARD TO FLIP */

selectedCard.addEventListener("click", event => {
  // Allow the purchase link to open without flipping.
  if (event.target.closest("a")) return;

  // Allow visitors to select and copy the text.
  if (window.getSelection()?.toString()) return;

  setFlipped(!isFlipped);
});

/* CLICK OUTSIDE TO CLOSE */

overlay.addEventListener("click", event => {
  if (event.target === overlay) closeCard();
});

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", event => {
  if (!overlay.classList.contains("active")) return;

  if (event.key === "Escape") {
    event.preventDefault();
    closeCard();
    return;
  }

  if (event.key !== "Tab") return;

  const visibleFace = isFlipped ? cardBack : cardFront;

  const controls = Array.from(
    visibleFace.querySelectorAll("button, a[href]")
  ).filter(element => !element.hidden);

  const first = controls[0];
  const last = controls[controls.length - 1];
  const active = document.activeElement;

  if (event.shiftKey) {
    if (active === first || !controls.includes(active)) {
      event.preventDefault();
      last.focus();
    }
  } else if (active === last || !controls.includes(active)) {
    event.preventDefault();
    first.focus();
  }
});
/* Open the object selected from a section page. */

const requestedObject = new URLSearchParams(
  window.location.search
).get("object");

if (requestedObject !== null) {
  const index = objects.findIndex(
    obj => String(obj.id) === requestedObject
  );

  if (index !== -1) {
    const trigger = archiveLine.children[index];

    const maxScroll = track.offsetHeight - window.innerHeight;
    const progress = objects.length > 1
      ? index / (objects.length - 1)
      : 0;

    window.scrollTo(
      0,
      track.offsetTop + progress * maxScroll
    );

    updateTarget();
    current = target;

    openCard(objects[index], trigger);
  }
}
