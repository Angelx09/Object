<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Price of Luck</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #282828;
  color: #191919;
  font-family: Arial, Helvetica, sans-serif;
}

button, a {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Header */

header {
  position: fixed;
  top: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 20;
  pointer-events: none;
}

header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: -.03em;
  text-transform: lowercase;
}

/* Left introduction */

.intro {
  position: fixed;
  left: 34px;
  top: 43%;
  width: 190px;
  z-index: 20;
  pointer-events: none;
}

.intro .eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.intro p {
  font-size: 12px;
  line-height: 1.6;
  color: #666;
}

/* Right navigation */

.categories {
  position: fixed;
  right: 34px;
  top: 85%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 13px;
}

.categories a {
  color: #b8b8b8;
  font-size: 14px;
  transition: color .25s ease;
}

.categories a:hover,
.categories a:focus-visible,
.categories a:first-child {
  color: #000;
}

/* Scrollable archive */

.scroll-track {
  position: relative;
  height: 750vh;
}

.scene {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  perspective: 1600px;
}

.archive {
  position: absolute;
  top: 46%;
  left: 54%;
  width: 1px;
  height: 1px;
  transform-style: preserve-3d;
}

.archive-line {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.archive-card {
  position: absolute;
  left: 0;
  top: 0;
  width: 210px;
  height: 290px;
  padding: 0;
  border: 1px solid #f8f8f8;
  background: #fff;
  color: inherit;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .3s ease-out;
  box-shadow: 1px 2px 5px #0000000b;
}

.archive-card:focus-visible {
  outline: 2px solid #191919;
  outline-offset: 4px;
}

/* Image area */

.picture {
  width: 100%;
  height: 82%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 64px;
  overflow: hidden;
}

.picture img,
.selected-image img {
  width: 100%;
  height: 100%;
  display: block;

  /* Change to "contain" to show photos without cropping. */
  object-fit: cover;
}

.label {
  height: 18%;
  background: #f7f6f3;
  padding: 9px;
  text-align: left;
  font-size: 9px;
}

.label-name {
  display: block;
  margin-top: 5px;
  color: #777;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scroll-hint {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: .08em;
  color: #777;
  z-index: 20;
  pointer-events: none;
}

/* Enlarged card */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #faf9f675;
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s, visibility .35s;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

.selected-card {
  width: min(360px, 85vw);
  max-height: 88vh;
  background: #fff;
  box-shadow: 0 15px 65px #00000022;
  overflow-y: auto;
  transform: translateY(22px) scale(.94);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}

.selected-card:focus {
  outline: none;
}

.overlay.active .selected-card {
  transform: translateY(0) scale(1);
}

.selected-image {
  height: min(55vh, 460px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 105px;
  overflow: hidden;
}

.selected-info {
  padding: 18px 20px 20px;
}

.selected-number {
  color: #999;
  font-size: 10px;
  letter-spacing: .08em;
}

.selected-info h2 {
  font-size: 19px;
  font-weight: 400;
  margin: 12px 0;
}

.selected-info p {
  font-size: 12px;
  line-height: 1.6;
  color: #666;
  margin: 0;
}

@media (max-width: 700px) {
  .intro {
    left: 15px;
    top: 90px;
    width: 140px;
  }

  .categories {
    right: 15px;
    gap: 10px;
  }

  .categories a {
    font-size: 11px;
  }

  .archive-card {
    width: 170px;
    height: 235px;
  }

  .archive {
    left: 50%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .archive-card,
  .overlay,
  .selected-card {
    transition: none;
  }
}
</style>
</head>

<body>

<header>
  <h1>The price of luck</h1>
</header>

<aside class="intro">
  <div class="eyebrow">About the Archive</div>
  <p>
    A collection of objects perceived to carry luck,
    protection, and personal meaning.
  </p>
</aside>

<nav class="categories" aria-label="Object categories">
  <a href="category.html?category=all">All Objects</a>
  <a href="category.html?category=keepsakes">ONE</a>
  <a href="category.html?category=charms">TWO</a>
  <a href="category.html?category=rituals">THREE</a>
  <a href="category.html?category=gifts">FOUR</a>
  <a href="category.html?category=found">FIVE</a>
  <a href="category.html?category=memories">SIX</a>
</nav>

<div class="scroll-track" id="track">
  <div class="scene">
    <div class="archive">
      <div class="archive-line" id="archiveLine"></div>
    </div>
  </div>
</div>

<div class="scroll-hint">SCROLL TO EXPLORE ↕</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <article
    class="selected-card"
    id="selectedCard"
    role="dialog"
    aria-modal="true"
    aria-labelledby="selectedTitle"
    aria-describedby="selectedDescription"
    tabindex="-1"
  >
    <div class="selected-image" id="selectedImage"></div>

    <div class="selected-info">
      <div class="selected-number" id="selectedNumber"></div>
      <h2 id="selectedTitle"></h2>
      <p id="selectedDescription"></p>
    </div>
  </article>
</div>

<script>
/* ==========================================
   EDIT YOUR OBJECTS HERE

   Put your photos in an "images" folder
   beside this HTML file.

   Example:
   image: "images/lucky-coin.jpg"

   Copy an object below to add another one.
   Give each new object a unique id.
========================================== */

const objects = [
  {
    id: 1,
    name: "Street Button",
    image: "images/street-button.jpeg",
    symbol: "◉",
    color: "#b6aa97",
    category: "keepsakes",
    description:
      "Add the story behind your street button here."
  },
  {
    id: 2,
    name: "Eggplant Charm",
    image: "images/eggplant-charm.png",
    symbol: "〰",
    color: "#bd7770",
    category: "charms",
    description:
      "Add the story behind your eggplant charm here."
  },
  {
    id: 3,
    name: "Watch",
    image: "images/watch.jpeg",
    symbol: "▣",
    color: "#a6ada3",
    category: "memories",
    description:
      "Add the story behind your watch here."
  },
  {
    id: 4,
    name: "Four-Leaf Clover",
    image: "images/four-leaf-clover.jpg",
    symbol: "✳",
    color: "#b9bd96",
    category: "charms",
    description:
      "Add the story behind your clover here."
  },
  {
    id: 5,
    name: "Silver Ring",
    image: "images/silver-ring.jpg",
    symbol: "◌",
    color: "#b9b9b5",
    category: "gifts",
    description:
      "Add the story behind your silver ring here."
  },
  {
    id: 6,
    name: "Lucky Key",
    image: "images/lucky-key.jpg",
    symbol: "⚿",
    color: "#b4a389",
    category: "found",
    description:
      "Add the story behind your key here."
  },
  {
    id: 7,
    name: "Small Stone",
    image: "images/small-stone.jpg",
    symbol: "●",
    color: "#a5aaa9",
    category: "found",
    description:
      "Add the story behind your stone here."
  },
  {
    id: 8,
    name: "Paper Crane",
    image: "images/paper-crane.jpg",
    symbol: "◇",
    color: "#c5b4a4",
    category: "rituals",
    description:
      "Add the story behind your paper crane here."
  },
  {
    id: 9,
    name: "Family Bracelet",
    image: "images/family-bracelet.jpg",
    symbol: "◎",
    color: "#b9a5a1",
    category: "gifts",
    description:
      "Add the story behind your bracelet here."
  },
  {
    id: 10,
    name: "Wishing Star",
    image: "images/wishing-star.jpg",
    symbol: "✦",
    color: "#c7b69b",
    category: "rituals",
    description:
      "Add the story behind your wishing star here."
  },
  {
    id: 11,
    name: "Shell",
    image: "images/shell.jpg",
    symbol: "◔",
    color: "#a6b9b7",
    category: "found",
    description:
      "Add the story behind your shell here."
  },
  {
    id: 12,
    name: "Fortune Note",
    image: "images/fortune-note.jpg",
    symbol: "✉",
    color: "#d0c4aa",
    category: "memories",
    description:
      "Add the story behind your fortune note here."
  }
  {
    id: 12,
    name: "Fortune Note",
    image: "images/fortune-note.jpg",
    symbol: "✉",
    color: "#d0c4aa",
    category: "memories",
    description: "Add your story here."
  },
  {
    id: 13,
    name: "Your Next Object",
    image: "images/object-13.jpg",
    symbol: "◉",
    color: "#b6aa97",
    category: "keepsakes",
    description: "Add your next object's story here."
  }
];

/* Repeat the objects to keep the long stack.
   Change 4 to 1 to show each object only once. */

const REPEAT_COUNT = 4;

const archiveObjects = Array.from(
  { length: REPEAT_COUNT },
  () => objects
).flat();

const archiveLine = document.getElementById("archiveLine");
const track = document.getElementById("track");
const overlay = document.getElementById("overlay");
const selectedCard = document.getElementById("selectedCard");

const STEP = 28;
const ANGLE = -20 * Math.PI / 180;
const dx = Math.cos(ANGLE);
const dy = Math.sin(ANGLE);

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

/* Add a photo.
   If the photo is missing, show the symbol instead. */

function showImage(container, obj) {
  container.replaceChildren();
  container.style.backgroundColor = obj.color;

  const fallback = document.createElement("span");
  fallback.textContent = obj.symbol;
  fallback.setAttribute("aria-hidden", "true");

  container.appendChild(fallback);

  if (!obj.image) return;

  const img = document.createElement("img");
  img.alt = obj.name;

  // Hide the photo until it loads successfully.
  img.hidden = true;
  img.style.display = "none";

  img.addEventListener("load", () => {
    fallback.remove();
    img.hidden = false;
    img.style.display = "block";
  });

  img.addEventListener("error", () => {
    img.remove();
  });

  container.appendChild(img);
  img.src = obj.image;
}

/* Build the stack */

archiveObjects.forEach((obj, i) => {
  const card = document.createElement("button");
  card.className = "archive-card";
  card.type = "button";
  card.setAttribute("aria-label", "View " + obj.name);

  const x = i * STEP * dx;
  const y = i * STEP * dy;

  function positionCard(raised) {
    card.style.transform = `
      translate3d(${x}px, ${y - (raised ? 35 : 0)}px, 0)
      rotateY(-25deg)
    `;
  }

  positionCard(false);

  card.addEventListener("mouseenter", () => positionCard(true));
  card.addEventListener("mouseleave", () => {
    positionCard(document.activeElement === card);
  });

  card.addEventListener("focus", () => positionCard(true));
  card.addEventListener("blur", () => positionCard(false));

  const picture = document.createElement("div");
  picture.className = "picture";
  showImage(picture, obj);

  const label = document.createElement("div");
  label.className = "label";
  label.textContent =
    "OBJECT " + String(obj.id).padStart(3, "0");

  const name = document.createElement("span");
  name.className = "label-name";
  name.textContent = obj.name;

  label.appendChild(name);
  card.append(picture, label);

  card.addEventListener("click", () => openCard(obj, card));
  archiveLine.appendChild(card);
});

/* Smooth diagonal movement */

let current = 0;
let target = 0;

function updateTarget() {
  const maxScroll = track.offsetHeight - window.innerHeight;

  const progress = maxScroll > 0
    ? Math.min(
        1,
        Math.max(
          0,
          (window.scrollY - track.offsetTop) / maxScroll
        )
      )
    : 0;

  const total = Math.max(0, archiveObjects.length - 1) * STEP;

  target = -progress * total;
}

function animate() {
  current = reducedMotion
    ? target
    : current + (target - current) * .085;

  archiveLine.style.transform = `
    translate3d(
      ${current * dx - 105}px,
      ${current * dy - 145}px,
      0
    )
  `;

  requestAnimationFrame(animate);
}

window.addEventListener("scroll", updateTarget, { passive: true });
window.addEventListener("resize", updateTarget);

updateTarget();
animate();

/* Open and close the enlarged card */

let previousFocus = null;
let previousOverflow = "";

function openCard(obj, trigger) {
  previousFocus = trigger;
  previousOverflow = document.body.style.overflow;

  showImage(document.getElementById("selectedImage"), obj);

  document.getElementById("selectedNumber").textContent =
    "ARCHIVE / " + String(obj.id).padStart(3, "0");

  document.getElementById("selectedTitle").textContent = obj.name;

  document.getElementById("selectedDescription").textContent =
    obj.description;

  selectedCard.scrollTop = 0;
  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  selectedCard.focus({ preventScroll: true });
}

function closeCard() {
  if (!overlay.classList.contains("active")) return;

  overlay.classList.remove("active");
  overlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = previousOverflow;

  previousFocus?.focus({ preventScroll: true });
}

/* Click outside the card to close */

overlay.addEventListener("click", event => {
  if (event.target === overlay) closeCard();
});

/* Escape closes the card.
   Keep keyboard focus inside while it is open. */

document.addEventListener("keydown", event => {
  if (!overlay.classList.contains("active")) return;

  if (event.key === "Escape") {
    closeCard();
  }

  if (event.key === "Tab") {
    event.preventDefault();
    selectedCard.focus({ preventScroll: true });
  }
});
</script>

</body>
</html>
