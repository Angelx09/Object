<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Price of Luck</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #555;
      color: #191919;
      font-family: Georgia, "Times New Roman", serif;
    }

    button { font-family: inherit; }

    .page-background {
      position: fixed;
      inset: 0;
      background: #555 url("images/bg.jpeg") center / cover no-repeat;
      pointer-events: none;
    }

    .site-title,
    .instructions {
      position: fixed;
      z-index: 2;
      inset-inline: 16px;
      margin: 0;
      color: white;
      text-align: center;
      text-shadow: 0 1px 5px black, 0 0 12px black;
      pointer-events: none;
    }

    .site-title {
      top: 24px;
      font-size: 28px;
    }

    .instructions {
      bottom: 24px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .archive-about {
      position: fixed;
      z-index: 3;
      top: 43%;
      left: 4%;
      width: 160px;
      color: white;
      text-shadow: 0 1px 5px #0008;
      pointer-events: none;
    }

    .archive-about h2 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .archive-about p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .selection-controls {
      position: fixed;
      z-index: 4;
      top: 24px;
      right: 20px;
      display: flex;
      gap: 8px;
    }

    .selection-controls button {
      padding: 7px 13px;
      border: 1px solid #191919;
      border-radius: 30px;
      background: white;
      color: #191919;
      font-size: 14px;
      cursor: pointer;
    }

    .selection-controls button:disabled {
      opacity: .6;
      cursor: default;
    }

    .scroll-track {
      position: relative;
      height: 350vh;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .stack {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(150px, 36vw, 210px);
      height: clamp(210px, 50vw, 290px);
    }

    .archive-card {
      position: absolute;
      inset: 0;
      z-index: var(--layer);
      transform: translate(var(--x), var(--y)) skewY(-8deg);
      border: 2px solid white;
      box-shadow: 0 0 0 1px #191919, 2px 3px 0 #191919;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      z-index: 100;
      border-color: #fff500;
      transform: translate(var(--x), calc(var(--y) - 16px)) skewY(-8deg);
    }

    .card-number {
      position: absolute;
      right: 3px;
      bottom: 6px;
      padding: 3px;
      background: #191919;
      color: white;
      font-size: 11px;
      line-height: 1;
    }

    .archive-card.is-selected {
      border-color: #fff500;
    }

    .archive-card.is-selected::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 5px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff500;
      color: #191919;
      font-size: 16px;
      font-weight: bold;
    }

    .postcard {
      width: min(380px, calc(100vw - 32px));
      height: min(570px, calc(100dvh - 32px));
      max-width: none;
      max-height: none;
      padding: 0;
      border: 0;
      overflow: hidden;
      background: white;
      color: #191919;
    }

    .postcard::backdrop {
      background: rgb(0 0 0 / 65%);
    }

    .front,
    .back {
      height: 100%;
    }

    .front {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      text-align: center;
    }

    .object-heading,
    .back {
      background: var(--section-color, #fff500);
    }

    .object-heading {
      padding: 14px 16px;
    }

    .object-number {
      font-size: 11px;
      letter-spacing: .08em;
    }

    .object-title {
      margin: 5px 0 0;
      font-size: clamp(22px, 5vw, 32px);
      line-height: 1.05;
    }

    .object-photo {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      margin: 16px 14%;
      border-left: 2px solid #ff0098;
      border-right: 2px solid #ff0098;
      font-size: 48px;
    }

    .object-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      margin: 0;
      padding: 0 16px 10px;
      font-size: 17px;
    }

    .back {
      display: flex;
      flex-direction: column;
    }

    .story-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
      padding: 28px;
    }

    .story-text {
      margin: auto 0;
      font-size: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .purchase-link {
      align-self: flex-start;
      margin-top: 16px;
      color: inherit;
      font-size: 13px;
    }

    .flip-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-top: 1px solid rgb(0 0 0 / 20%);
      background: transparent;
      color: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .archive-about {
        top: 74px;
        left: 16px;
        width: 130px;
      }

      .selection-controls {
        top: 64px;
        right: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 155px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .archive-card { transition: none; }
    }
  </style>
</head>

<body>
  <div class="page-background" aria-hidden="true"></div>

  <header>
    <h1 class="site-title">The Price of Luck</h1>
  </header>

  <aside class="archive-about" aria-labelledby="aboutTitle">
    <h2 id="aboutTitle">About the Archive</h2>
    <p>A collection of objects believed to carry luck, protection, and personal meaning.</p>
  </aside>

  <div class="selection-controls" role="group" aria-label="Save postcards">
    <button id="selectPostcards" type="button" aria-pressed="false">Select</button>
    <button id="savePostcards" type="button" hidden disabled>Save selected (0)</button>
  </div>

  <main id="track" class="scroll-track" aria-label="Lucky object archive">
    <div class="scene">
      <div id="stack" class="stack"></div>
    </div>
  </main>

  <p class="instructions">Scroll to explore · Click a card to reveal</p>

  <dialog id="postcard" class="postcard" aria-label="Postcard">
    <section id="front" class="front">
      <div class="object-heading">
        <div id="objectNumber" class="object-number"></div>
        <h2 id="objectTitle" class="object-title"></h2>
      </div>

      <div id="objectPhoto" class="object-photo"></div>
      <p id="objectCaption" class="caption" hidden></p>

      <button id="showStory" class="flip-button" type="button">
        Flip to read the story ↗
      </button>
    </section>

    <section id="back" class="back" hidden>
      <div id="storyContent" class="story-content">
        <p id="objectStory" class="story-text"></p>
        <a id="purchaseLink" class="purchase-link"
           target="_blank" rel="noopener noreferrer" hidden></a>
      </div>

      <button id="showObject" class="flip-button" type="button">
        Back to the object ↶
      </button>
    </section>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    const colors = {
      wearables: "#FFF500",
      rituals: "#FF9BCB",
      paper: "#B9DFFF",
      keychains: "#BFE6AE",
      found: "#FFC18C",
      others: "#CDBBFA"
    };

    const fortuneNote = { name: "Fortune Note", image: "fortune-note.jpg" };
    const clover = { name: "Four-Leaf Clover", image: "four-leaf-clover.jpg" };
    const watchPlaceholder = { name: "watch", image: "four-leaf-clover.jpg" };

    // Edit the names, image filenames, captions, and stories here.
    const objects = [
      {
        id: 1,
        name: "Jade Heart Necklace",
        image: "jade-heart-necklace.png",
        category: "wearables",
        description: "Chloe C",
        backText: "Every summer, Chloe’s mom would buy her a jade necklace. Over time, it became their tradition. Chloe wore hers every day, wherever she went. She believed the jade brought her luck and protection, and it felt especially meaningful because it came from her mom. When the jade chipped and its green color faded, Chloe felt as though some of its luck had faded with it. Her mom bought her another necklace, and Chloe has kept it for years. By now, it holds memories of her mom and all the time she’s spent wearing it. If she ever lost it, she’d do everything she could to find it again."
      },
      {
        id: 2,
        name: "Scorpio Necklace",
        image: "Yellow GOld Scorpio Necklace.png",
        category: "wearables",
        description: "Coby",
        backText: "Coby got it at a crystal shop in Hawaii a few years ago. It’s been with Coby for so long that it’s come to feel lucky. “It’s like a child to me,” Coby says. It’s something Coby plans to keep forever."
      },
      {
        id: 3,
        name: "Polished Wooden Bead Bracelet",
        image: "polished-wooden-bead-bracelet.png",
        category: "wearables",
        description: "Dad"
      },
      {
        id: 4,
        name: "Golden Bead Bracelet",
        image: "golden-bead-bracelet.png",
        category: "wearables",
        description: "Mom"
      },
      {
        id: 5,
        name: "Red Twisted Cord with Gold Charm",
        image: "red-twisted-cord.png",
        category: "wearables",
        description: "Anne L",
        backText: "My mom gave me this gold Winnie the Pooh necklace for my sixth birthday. In Chinese culture, giving someone gold can be a way of wishing them good luck. I’ve had this necklace for so long that it holds memories from different parts of my life. When I wear it, I feel like I’m carrying a little of that luck with me, along with a reminder of my mom’s love."
      },
      {
        id: 6,
        name: "Watch",
        image: "watch.jpeg",
        category: "wearables",
        description: "Faizul Rahman",
        backText: "I think I started thinking of my watch as lucky in 2023, when I wore it to an accounting exam. I hadn’t studied much, so I went in nervous and just hoping to pass. I ended up with a decent grade, and that gave me a little more confidence. Ever since, this is the watch I reach for when I have something important coming up."
      },
      {
        id: 7,
        name: "Black Beaded Necklace with Carved Pendant",
        image: "black-beaded-necklace.png",
        category: "wearables",
        description: "Terry W"
      },
      {
        id: 8,
        name: "Silver Chain",
        image: "silver-chain.png",
        category: "wearables",
        description: "William Z",
        backText: "I got my first necklace when I was so young that I barely remember what my dad said about it. I remember him telling me to keep it on, so I did. I wore it day and night, taking it off only for things like X-rays. When I got older, I asked him what it meant. He told me it was supposed to bring me luck, protect me, and keep me in good health. As I got older, I started noticing how rarely I got sick, even when I was stressed and barely sleeping. The necklace had gotten me this far, I figured. Why take it off and find out? When I outgrew the first one, my parents gave me a new one. That’s why there are two necklaces. I wear a different one now, but it means the same thing to me."
      },
      { id: 9, name: "Amethyst Cathedral", image: "Amethyst-cathedral.png", category: "rituals" },
      { id: 10, name: "Framed Chinese Amber Ornament", image: "Framed-Chinese-Amber-Ornament.png", category: "rituals" },
      { id: 11, name: "Shell", image: "shell.jpg", category: "rituals" },
      { ...fortuneNote, id: 12, category: "rituals" },
      { ...fortuneNote, id: 13, category: "rituals" },
      { ...fortuneNote, id: 14, category: "rituals" },
      { ...fortuneNote, id: 15, category: "rituals" },
      { ...fortuneNote, id: 16, category: "rituals" },
      { id: 17, name: "Red Pocket", image: "Red.png", category: "paper", description: "Virgil L" },
      { ...fortuneNote, id: 18, category: "paper" },
      { id: 19, name: "Yellow Talisman", image: "yellow-tailsman.png", category: "paper", description: "Nathan J" },
      { ...fortuneNote, id: 20, category: "paper" },
      { ...watchPlaceholder, id: 21, category: "paper" },
      { ...clover, id: 22, category: "paper" },
      { ...watchPlaceholder, id: 23, category: "paper" },
      { ...clover, id: 24, category: "paper" },
      { id: 25, name: "Eggplant Keychain", image: "Eggplant-Keychain.png", category: "keychains" },
      { id: 26, name: "Pink Plush Bunny Keychain", image: "Pink-plush-keychain.png", category: "keychains" },
      { id: 27, name: "Red Underwear", image: "Red-Underwear.jpg", category: "keychains" },
      { ...clover, id: 28, category: "keychains" },
      { ...watchPlaceholder, id: 29, category: "keychains" },
      { ...clover, id: 30, category: "keychains" },
      { ...clover, id: 31, category: "keychains" },
      { ...clover, id: 32, category: "keychains" },
      { id: 33, name: "Lysol Disinfectant Spray", image: "Lysol.png", category: "found" },
      { id: 34, name: "Light Aqua Blue Helmet", image: "Light-aqua-blue-helmet.png", category: "found" },
      { id: 35, name: "Yellow Pencil with its Full Eraser", image: "yellow-pencil.png", category: "found" },
      { ...clover, id: 36, category: "found" },
      { ...watchPlaceholder, id: 37, category: "found" },
      { ...clover, id: 38, category: "found" },
      { ...watchPlaceholder, id: 39, category: "found" },
      { ...clover, id: 40, category: "found" },
      { id: 41, name: "Lysol Disinfectant Spray", image: "Lysol.png", category: "others" },
      { id: 42, name: "Big Blue Helmet", image: "Light-aqua-blue-helmet.png", category: "others" },
      { id: 43, name: "Tetronica Pencil with its Full Eraser", image: "yellow-pencil.png", category: "others" },
      { ...clover, id: 44, category: "others" },
      { ...watchPlaceholder, id: 45, category: "others" },
      { ...clover, id: 49, category: "others" },
      { ...watchPlaceholder, id: 46, category: "others" },
      { ...clover, id: 47, category: "others" },
      { ...watchPlaceholder, id: 48, category: "others" }
    ];

    const track = document.getElementById("track");
    const stack = document.getElementById("stack");
    const postcard = document.getElementById("postcard");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const number = document.getElementById("objectNumber");
    const title = document.getElementById("objectTitle");
    const photo = document.getElementById("objectPhoto");
    const caption = document.getElementById("objectCaption");
    const story = document.getElementById("objectStory");
    const storyContent = document.getElementById("storyContent");
    const purchaseLink = document.getElementById("purchaseLink");
    const showStory = document.getElementById("showStory");
    const showObject = document.getElementById("showObject");
    const selectButton = document.getElementById("selectPostcards");
    const saveButton = document.getElementById("savePostcards");

    const selectedIds = new Set();
    const stepX = 30;
    const stepY = -10;
    const lastIndex = Math.max(0, objects.length - 1);

    let selecting = false;
    let previousCard = null;
    let previousOverflow = "";

    function scrollDistance() {
      return Math.max(1, track.offsetHeight - innerHeight);
    }

    function updateStack() {
      const progress = Math.min(1, Math.max(0, scrollY / scrollDistance()));
      const index = progress * lastIndex;
      stack.style.transform =
        \`translate(calc(-50% - \${index * stepX}px), calc(-50% + \${index * -stepY}px))\`;
    }

    function updateSaveButton() {
      saveButton.hidden = !selecting;
      saveButton.disabled = selectedIds.size === 0;
      saveButton.textContent = \`Save selected (\${selectedIds.size})\`;
    }

    function flipCard(showingBack) {
      front.hidden = showingBack;
      back.hidden = !showingBack;

      if (showingBack) storyContent.scrollTop = 0;

      if (postcard.open) {
        (showingBack ? showObject : showStory).focus({ preventScroll: true });
      }
    }

    async function fillPostcard(object) {
      postcard.style.setProperty("--section-color", colors[object.category] ?? "#fff500");
      postcard.setAttribute("aria-label", object.name);
      number.textContent = \`Object \${object.id}\`;
      title.textContent = object.name;
      caption.textContent = object.description ?? "";
      caption.hidden = !caption.textContent;
      story.textContent = object.backText ?? object.backtxt ?? "Personal story";

      purchaseLink.hidden = true;
      purchaseLink.removeAttribute("href");

      if (object.purchaseUrl) {
        try {
          const url = new URL(object.purchaseUrl);
          if (url.protocol === "https:" || url.protocol === "http:") {
            purchaseLink.href = url.href;
            purchaseLink.textContent = (object.purchaseLabel || "Visit website") + " ↗";
            purchaseLink.hidden = false;
          }
        } catch {
          // An invalid purchase URL leaves the link hidden.
        }
      }

      const fallback = document.createElement("span");
      fallback.textContent = object.symbol || "◇";
      fallback.setAttribute("aria-hidden", "true");
      photo.replaceChildren(fallback);

      if (!object.image) return false;

      const image = new Image();
      image.alt = object.name;
      image.src = object.image.startsWith("images/")
        ? object.image
        : \`images/\${object.image}\`;

      try {
        await image.decode();
        if (photo.contains(fallback)) photo.replaceChildren(image);
        return true;
      } catch {
        return false;
      }
    }

    function openObject(object, card) {
      previousCard = card;
      previousOverflow = document.body.style.overflow;
      fillPostcard(object);
      flipCard(false);
      postcard.showModal();
      document.body.style.overflow = "hidden";
      showStory.focus({ preventScroll: true });
    }

    objects.forEach((object, index) => {
      const card = document.createElement("button");
      card.className = "archive-card";
      card.type = "button";
      card.setAttribute("aria-label", \`Object \${object.id}, \${object.name}\`);
      card.setAttribute("aria-haspopup", "dialog");
      card.style.setProperty("--x", \`\${index * stepX}px\`);
      card.style.setProperty("--y", \`\${index * stepY}px\`);
      card.style.setProperty("--layer", objects.length - index);

      const label = document.createElement("span");
      label.className = "card-number";
      label.textContent = String(object.id).padStart(2, "0");
      label.setAttribute("aria-hidden", "true");
      card.append(label);

      card.addEventListener("click", () => {
        if (!selecting) {
          openObject(object, card);
          return;
        }

        const checked = !selectedIds.has(object.id);
        if (checked) selectedIds.add(object.id);
        else selectedIds.delete(object.id);

        card.classList.toggle("is-selected", checked);
        card.setAttribute("aria-pressed", String(checked));
        updateSaveButton();
      });

      card.addEventListener("focus", () => {
        if (!card.matches(":focus-visible")) return;

        const bounds = card.getBoundingClientRect();
        if (bounds.left < 0 || bounds.right > innerWidth ||
            bounds.top < 0 || bounds.bottom > innerHeight) {
          scrollTo(0, index / Math.max(1, lastIndex) * scrollDistance());
          updateStack();
        }
      });

      stack.append(card);
    });

    selectButton.addEventListener("click", () => {
      selecting = !selecting;
      selectedIds.clear();
      selectButton.textContent = selecting ? "Cancel" : "Select";
      selectButton.setAttribute("aria-pressed", String(selecting));

      for (const card of stack.children) {
        card.classList.remove("is-selected");
        if (selecting) {
          card.removeAttribute("aria-haspopup");
          card.setAttribute("aria-pressed", "false");
        } else {
          card.removeAttribute("aria-pressed");
          card.setAttribute("aria-haspopup", "dialog");
        }
      }

      updateSaveButton();
    });

    showStory.addEventListener("click", () => flipCard(true));
    showObject.addEventListener("click", () => flipCard(false));

    postcard.addEventListener("click", event => {
      if (event.target !== postcard) return;

      const bounds = postcard.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) {
        postcard.close();
      }
    });

    postcard.addEventListener("close", () => {
      document.body.style.overflow = previousOverflow;
      previousCard?.focus({ preventScroll: true });
    });

    async function capturePostcard(side) {
      const canvas = await window.html2canvas(postcard, {
        scale: 3,
        backgroundColor: "#fff",
        logging: false,
        useCORS: true,
        onclone: async (copyDocument, copy) => {
          copy.setAttribute("open", "");
          copy.querySelector("#front").hidden = side !== "front";
          copy.querySelector("#back").hidden = side !== "back";
          copy.querySelector("#storyContent").scrollTop = 0;

          Object.assign(copy.style, {
            position: "fixed",
            inset: "0 auto auto 0",
            margin: "0"
          });

          await copyDocument.fonts.ready;

          if (side === "front") {
            const area = copy.querySelector("#objectPhoto");
            const image = area.querySelector("img");

            if (image) {
              await image.decode();

              // Preserve the on-screen object-fit: contain framing.
              const scale = Math.min(
                area.clientWidth / image.naturalWidth,
                area.clientHeight / image.naturalHeight
              );
              const width = image.naturalWidth * scale;
              const height = image.naturalHeight * scale;

              Object.assign(image.style, {
                inset: "auto",
                left: \`\${(area.clientWidth - width) / 2}px\`,
                top: \`\${(area.clientHeight - height) / 2}px\`,
                width: \`\${width}px\`,
                height: \`\${height}px\`
              });
            }
          }
        }
      });

      if (!canvas.width || !canvas.height) {
        throw new Error("The postcard capture was empty.");
      }

      return canvas;
    }

    saveButton.addEventListener("click", async () => {
      const selected = objects.filter(object => selectedIds.has(object.id));
      if (!selected.length) return;

      const Pdf = window.jspdf?.jsPDF;
      if (!Pdf || !window.html2canvas) {
        alert("The PDF tools couldn’t load. Check your internet connection and refresh.");
        return;
      }

      selectButton.disabled = true;
      saveButton.disabled = true;
      stack.inert = true;

      try {
        const pdf = new Pdf({
          orientation: "portrait",
          unit: "in",
          format: [4, 6],
          compress: true
        });

        let pageCount = 0;
        const missingPhotos = [];

        for (const [index, object] of selected.entries()) {
          saveButton.textContent = \`Preparing \${index + 1} of \${selected.length}…\`;

          const photoLoaded = await fillPostcard(object);
          if (object.image && !photoLoaded) missingPhotos.push(object.name);

          for (const side of ["front", "back"]) {
            const canvas = await capturePostcard(side);
            const scale = Math.min(4 / canvas.width, 6 / canvas.height);
            const width = canvas.width * scale;
            const height = canvas.height * scale;

            if (pageCount > 0) pdf.addPage([4, 6], "portrait");
            pdf.addImage(canvas, "PNG", (4 - width) / 2, (6 - height) / 2, width, height);
            pageCount++;
          }
        }

        pdf.save("The-Price-of-Luck-postcards.pdf");

        if (missingPhotos.length) {
          alert("The PDF was saved. Check the photo filenames for:\n\n" + missingPhotos.join("\n"));
        }
      } catch (error) {
        console.error(error);
        alert("The PDF couldn’t be created. Open the site with VS Code Live Server and try again.");
      } finally {
        stack.inert = false;
        selectButton.disabled = false;
        updateSaveButton();
      }
    });

    window.addEventListener("scroll", updateStack, { passive: true });
    window.addEventListener("resize", updateStack);
    updateStack();
  </script>
</body>
</html>
