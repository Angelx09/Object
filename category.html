<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Price of Luck — Objects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&display=swap">

<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: #faf9f6;
  color: #191919;
  font-family: Arial, sans-serif;
}

button, a { color: inherit; font: inherit; }
a { text-decoration: none; }

header {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 72px;
  padding: 12px 34px;
}

.site-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 16px;
  text-transform: lowercase;
}

.back-link {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  font-size: 24px;
}

.section-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  padding: 12px 34px 26px;
}

.section-nav a { color: #67635d; font-size: 12px; }

.section-nav a[aria-current="page"],
.section-nav a:hover,
.section-nav a:focus-visible {
  color: #191919;
  text-decoration: underline;
  text-decoration-color: var(--link-color, currentColor);
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}

/* CATEGORY CATALOG */

.catalog-section {
  --rule: #b9b5ae;
  margin: 0 34px 56px;
  border: 1px solid var(--rule);
}

.catalog-strip {
  height: 7px;
  background: var(--section-color);
  border-bottom: 1px solid var(--rule);
}

.catalog-hero {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-bottom: 1px solid var(--rule);
}

.catalog-intro { padding: clamp(24px, 4vw, 64px); }

.catalog-kicker, .catalog-feature-label, .catalog-bar, .catalog-number {
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.catalog-kicker { margin: 0 0 22px; }

.catalog-title {
  margin: 0 0 18px;
  font: 400 clamp(36px, 6vw, 84px)/1 Fraunces, Georgia, serif;
  letter-spacing: -.055em;
}

.catalog-description {
  max-width: 38ch;
  margin: 0;
  font-size: clamp(15px, 1.7vw, 21px);
  line-height: 1.5;
}

.catalog-feature, .catalog-object {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.catalog-feature {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 18px;
  min-height: 320px;
  padding: 26px 24px;
  border-left: 1px solid var(--rule);
  background: color-mix(in srgb, var(--section-color) 20%, white);
}

.catalog-feature-label { text-align: center; }

.catalog-image, .postcard-photo {
  position: relative;
  display: grid;
  place-items: center;
}

.catalog-image img, .postcard-photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.catalog-feature .catalog-image {
  width: min(100%, 320px);
  height: clamp(180px, 24vw, 330px);
}

.catalog-bar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 18px;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--rule);
}

.catalog-object {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.catalog-object:nth-child(4n) { border-right: 0; }

.catalog-object .catalog-image {
  width: 100%;
  aspect-ratio: 1;
  background: white;
}

.catalog-object .catalog-image img {
  inset: 12%;
  width: 76%;
  height: 76%;
}

.catalog-caption {
  width: 100%;
  padding: 14px 16px 18px;
}

.catalog-caption-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px 10px;
}

.catalog-object-title { font: 400 16px/1.15 Fraunces, Georgia, serif; }
.catalog-number, .catalog-object-caption { color: #57534d; }

.catalog-object-caption {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  line-height: 1.45;
}

.catalog-object:hover .catalog-object-title,
.catalog-feature:hover .catalog-feature-label {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.catalog-object:focus-visible,
.catalog-feature:focus-visible {
  outline-offset: -4px;
}

.photo-placeholder { color: #999; font-size: 18px; }

/* ENLARGED POSTCARD */

body:has(#postcard[open]) { overflow: hidden; }

#postcard {
  width: min(440px, calc(100vw - 104px), 60vh);
  height: min(700px, 86vh);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 0;
  overflow: visible;
  background: transparent;
  color: #191919;
}

#postcard::backdrop {
  background: #faf9f699;
  backdrop-filter: blur(5px);
}

.postcard-shell {
  position: relative;
  height: 100%;
  perspective: 1400px;
}

.postcard-turn {
  position: relative;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .65s ease;
}

.postcard-turn.flipped { transform: rotateY(180deg); }
.postcard-turn.reset { transition: none; }

.postcard-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: white;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 15px 65px #0002;
  cursor: pointer;
}

.postcard-heading {
  padding: 14px 12px;
  background: var(--card-color);
  text-align: center;
}

.postcard-number { font-size: 12px; }

.postcard-title {
  margin: 4px 0 0;
  font: 700 clamp(17px, 3.8vw, 30px)/1.08 Fraunces, Georgia, serif;
}

.postcard-photo {
  flex: 1;
  min-height: 0;
  margin: 7% 14% 4%;
}

.postcard-photo img {
  inset: 0 10px;
  width: calc(100% - 20px);
}

.postcard-photo::before, .postcard-photo::after {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 8px;
  border-block: 1px solid #ff0098;
  content: "";
  pointer-events: none;
}

.postcard-photo::before { left: 0; border-left: 1px solid #ff0098; }
.postcard-photo::after { right: 0; border-right: 1px solid #ff0098; }

.postcard-caption {
  margin: 0;
  padding: 12px 14px;
  text-align: center;
  font: italic clamp(16px, 3vw, 26px)/1.2 Fraunces, Georgia, serif;
}

.postcard-back {
  transform: rotateY(180deg);
  background: var(--card-color);
}

.postcard-copy {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10% 12%;
}

.postcard-copy-inner {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

.postcard-story {
  margin: 0;
  font: 400 clamp(13px, 2vw, 18px)/1.4 Fraunces, Georgia, serif;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.postcard-email {
  display: inline-block;
  margin-top: 22px;
  padding-bottom: 4px;
  border-bottom: 1px solid currentColor;
  font-size: 13px;
}

.postcard-flip {
  flex: 0 0 36px;
  border: 0;
  background: transparent;
  color: #444;
  font-size: 11px;
  cursor: pointer;
}

.postcard-arrow {
  position: absolute;
  top: 50%;
  z-index: 1;
  width: 38px;
  height: 38px;
  transform: translateY(-50%);
  border: 0;
  border-radius: 50%;
  background: white;
  color: #191919;
  font-size: 20px;
  cursor: pointer;
}

.postcard-arrow:hover { background: var(--card-color); }
.postcard-prev { right: calc(100% + 8px); }
.postcard-next { left: calc(100% + 8px); }

@media (max-width: 760px) {
  header, .section-nav { padding-inline: 16px; }
  .catalog-section { margin: 0 16px 40px; }
  .catalog-hero { grid-template-columns: 1fr; }

  .catalog-feature {
    min-height: 0;
    border-left: 0;
    border-top: 1px solid var(--rule);
  }

  .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .catalog-object:nth-child(2n) { border-right: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .postcard-turn { transition: none; }
}
.cart-toggle {
  margin-left: auto;
  padding: 8px 0;
  border: 0;
  background: transparent;
  font-size: 12px;
  cursor: pointer;
}

button.postcard-email {
  padding: 0 0 4px;
  border: 0;
  border-bottom: 1px solid currentColor;
  background: transparent;
  cursor: pointer;
}

#cartDialog {
  width: min(470px, calc(100% - 32px));
  max-height: 85vh;
  padding: 24px;
  border: 1px solid #b9b5ae;
  background: #faf9f6;
  color: #191919;
}

#cartDialog::backdrop { background: #19191955; }

.cart-header, .cart-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.cart-header h2 {
  margin: 0;
  font: 400 28px Fraunces, Georgia, serif;
}

.cart-item {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 4px solid var(--item-color);
}

.cart-item h3 { margin: 0 0 12px; }

.cart-item label {
  display: grid;
  gap: 5px;
  margin-bottom: 12px;
  font-size: 13px;
}

.cart-item input, .cart-item textarea {
  width: 100%;
  padding: 9px;
  border: 1px solid #b9b5ae;
  background: white;
  font: inherit;
}

.cart-item textarea { resize: vertical; }
#cartDialog button { cursor: pointer; }

.cart-preview {
  width: min(100%, 300px);
  margin: 16px auto;
}

.cart-preview-card {
  aspect-ratio: 2 / 3;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: white;
  box-shadow: 0 4px 16px #0002;
}

.cart-preview-back {
  background: var(--card-color);
}

.cart-preview-flip {
  display: block;
  margin: 10px auto 0;
  padding: 4px 0;
  border: 0;
  border-bottom: 1px solid currentColor;
  background: transparent;
  font-size: 12px;
}

.cart-preview .postcard-title {
  font-size: 20px;
}

.cart-preview .postcard-caption {
  font-size: 15px;
}

.cart-preview .postcard-story.is-empty {
  color: #444;
  font-style: italic;
}
.catalog-tile {
  position: relative;
  min-width: 0;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.catalog-tile:nth-child(4n) {
  border-right: 0;
}

.catalog-tile > .catalog-object {
  width: 100%;
  height: 100%;
  border: 0;
}

.grid-cart,
.postcard-cart {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  padding: 6px 9px;
  border: 1px solid #b9b5ae;
  background: white;
  color: #191919;
  font-size: 11px;
  line-height: 1.2;
  cursor: pointer;
}

.grid-cart:hover:not(:disabled),
.postcard-cart:hover {
  background: var(--section-color, var(--card-color, #faf9f6));
}

.grid-cart:disabled {
  opacity: .7;
  cursor: default;
}

/* Give the corner button room above the postcard title. */
.postcard-shell .postcard-heading {
  padding-top: 44px;
}

@media (max-width: 760px) {
  .catalog-tile:nth-child(2n) {
    border-right: 0;
  }
}

</style>
</head>

<body>
<header>
  <a class="back-link" href="index.html" aria-label="Back to stack">←</a>
  <a class="site-title" href="index.html">The Price of Luck</a>
  <button class="cart-toggle" id="cartToggle" type="button">
  Cart (0)
</button>
</header>

<nav class="section-nav" id="sectionNav" aria-label="Object sections"></nav>
<main id="collection"></main>

<dialog id="postcard" aria-labelledby="postcardTitle">
  <div class="postcard-shell">
    <div class="postcard-turn" id="postcardTurn">
      <div class="postcard-face" id="frontFace">
        <div class="postcard-heading">
          <div class="postcard-number" id="postcardNumber"></div>
          <h2 class="postcard-title" id="postcardTitle"></h2>
        </div>
        <div class="postcard-photo" id="postcardPhoto"></div>
        <p class="postcard-caption" id="postcardCaption"></p>
        <button class="postcard-flip" id="flipBack" type="button">Click to flip ↗</button>
      </div>

      <div class="postcard-face postcard-back" id="backFace" inert aria-hidden="true">
        <div class="postcard-copy" id="postcardCopy">
          <div class="postcard-copy-inner">
            <p class="postcard-story" id="postcardStory"></p>
            <button class="postcard-cart" id="addToCart" type="button">
  Add to cart +
</button>
          </div>
        </div>
        <button class="postcard-flip" id="flipFront" type="button">Click to return ↶</button>
      </div>
    </div>

    <button class="postcard-arrow postcard-prev" id="previousCard"
      type="button" aria-label="Previous postcard">←</button>
    <button class="postcard-arrow postcard-next" id="nextCard"
      type="button" aria-label="Next postcard">→</button>
  </div>
</dialog>
<dialog id="cartDialog" aria-labelledby="cartTitle">
  <div class="cart-header">
    <h2 id="cartTitle">Your postcards</h2>
    <button id="closeCart" type="button" aria-label="Close cart">×</button>
  </div>
  <div id="cartItems"></div>
</dialog>
<script>
/* Each row is [image filename, optional caption, optional back story].
   Section names, colors, and descriptions are edited below. */

const jadeStory =
  "Every summer, Chloe’s mom would buy her a jade necklace. Over time, it became their tradition. Chloe wore hers every day, wherever she went. She believed the jade brought her luck and protection, and it felt especially meaningful because it came from her mom.\n\n" +
  "When the jade chipped and its green color faded, Chloe felt as though some of its luck had faded with it. Her mom bought her another necklace, and Chloe has kept it for years. By now, it holds memories of her mom and all the time she’s spent wearing it. If she ever lost it, she’d do everything she could to find it again.";

const ritualPlaceholder =
  "Personal story word filling up this postcards about how the object holds significant meanings to this person.";

const sectionData = [
  {
    key: "wearables",
    name: "Wearables",
    objectLabel: "Wearable",
    color: "#FFF500",
    description: "Objects worn close to the body, carrying luck and protection.",
    defaultStory: "boo",
    rows: [
      ["jade-heart-necklace.png", "Chloe C", jadeStory],
      ["Yellow Gold Scorpio Necklace.png"],
      ["polished-wooden-bead-bracelet.png"],
      ["red-twisted-cord.png"],
      ["golden-bead-bracelet.png"],
      ["watch.jpeg"],
      ["black-beaded-necklace.png"],
      ["silver-chain.png"]
    ]
  },
  {
    key: "rituals",
    name: "Rituals",
    objectLabel: "Ritual Object",
    color: "#FF9BCB",
    description: "Objects given meaning through repeated actions and beliefs.",
    defaultStory: ritualPlaceholder,
    rows: [
      ["Amethyst-cathedral.png", "name", "Behavior phenomenon"],
      ["Framed-Chinese-Amber-Ornament.png", "name", "behavior"],
      ["object-11.jpg"], ["object-12.jpg"], ["object-13.jpg"],
      ["object-14.jpg"], ["object-15.jpg"], ["object-16.jpg"]
    ]
  },
  {
    key: "paper",
    name: "Paper",
    objectLabel: "Paper Object",
    color: "#B9DFFF",
    description: "Wishes, messages, and memories held on paper.",
    rows: [
      ["Red.png"], ["yellow-tailsman.png"], ["object-19.jpg"], ["object-20.jpg"],
      ["object-21.jpg"], ["object-22.jpg"], ["object-23.jpg"], ["object-24.jpg"]
    ]
  },
  {
    key: "keychains",
    name: "Keychains",
    objectLabel: "Keychain",
    color: "#BFE6AE",
    description: "Small companions carried from place to place.",
    rows: [
      ["Eggplant-plush-keychain.png"], ["pink-plush-keychain.png"],
      ["object-27.jpg"], ["object-28.jpg"], ["object-29.jpg"],
      ["object-30.jpg"], ["object-31.jpg"], ["object-32.jpg"]
    ]
  },
  {
    key: "found",
    name: "Found Objects",
    objectLabel: "Found Object",
    color: "#FFC18C",
    description: "Unexpected discoveries given a meaning of their own.",
    rows: [
      ["Lysol.png"], ["Light-aqua-blue-helmet.png"], ["yellow-pencil.png"],
      ["object-36.jpg"], ["object-37.jpg"], ["object-38.jpg"],
      ["object-39.jpg"], ["object-40.jpg"]
    ]
  },
  {
    key: "others",
    name: "Others",
    objectLabel: "Object",
    color: "#CDBBFA",
    description: "Other ordinary objects with extraordinary personal meaning.",
    rows: [
      ["object-41.jpg"], ["object-42.jpg"], ["object-43.jpg"], ["object-44.jpg"],
      ["object-45.jpg"], ["object-46.jpg"], ["object-47.jpg"], ["object-48.jpg"]
    ]
  }
];

sectionData.forEach((group, groupIndex) => {
  group.items = group.rows.map((row, index) => {
    const id = groupIndex * 8 + index + 1;
    const number = group.key === "others" ? id : index + 1;

    return {
      id,
      group,
      name: group.objectLabel + " " + number,
      image: row[0],
      description: row[1] ?? "name",
      backText: row[2] ?? group.defaultStory ?? "Behavior phenomenon"
    };
  });
});

const params = new URLSearchParams(window.location.search);
const requested = params.get("section");
const selectedGroup = sectionData.find((group, index) =>
  requested === group.key || requested === String(index + 1)
);

const shownGroups = selectedGroup ? [selectedGroup] : sectionData;
const visibleObjects = shownGroups.flatMap(group => group.items);

document.title =
  (selectedGroup ? selectedGroup.name : "All Objects") + " — The Price of Luck";

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addPhoto(container, object) {
  const placeholder = element("span", "photo-placeholder", "✳");
  placeholder.setAttribute("aria-hidden", "true");
  container.replaceChildren(placeholder);

  if (!object.image) return;

  const image = new Image();
  image.alt = object.name;

  image.addEventListener("load", () => {
    if (placeholder.parentNode === container) placeholder.replaceWith(image);
  }, { once: true });

  image.src = "images/" + object.image;
}

/* NAVIGATION */

const nav = document.getElementById("sectionNav");
const allLink = element("a", "", "All Objects");
allLink.href = "category.html";
if (!selectedGroup) allLink.setAttribute("aria-current", "page");
nav.append(allLink);

for (const group of sectionData) {
  const link = element("a", "", group.name);
  link.href = "category.html?section=" + group.key;
  link.style.setProperty("--link-color", group.color);
  if (group === selectedGroup) link.setAttribute("aria-current", "page");
  nav.append(link);
}

/* POSTCARD VIEWER */

const dialog = document.getElementById("postcard");
const turn = document.getElementById("postcardTurn");
const front = document.getElementById("frontFace");
const back = document.getElementById("backFace");
const flipBack = document.getElementById("flipBack");
const flipFront = document.getElementById("flipFront");
const previous = document.getElementById("previousCard");
const next = document.getElementById("nextCard");

let currentIndex = 0;
let returnFocus;

function setFlipped(showBack, moveFocus = true) {
  const shown = showBack ? back : front;
  const hidden = showBack ? front : back;

  shown.inert = false;
  shown.removeAttribute("aria-hidden");

  if (moveFocus) {
    (showBack ? flipFront : flipBack).focus({ preventScroll: true });
  }

  hidden.inert = true;
  hidden.setAttribute("aria-hidden", "true");
  turn.classList.toggle("flipped", showBack);
}

function openObject(index, trigger) {
  const object = visibleObjects[index];
  if (!object) return;

  currentIndex = index;
  if (!dialog.open) returnFocus = trigger || document.activeElement;

  if (back.contains(document.activeElement)) {
    next.focus({ preventScroll: true });
  }

  turn.classList.add("reset");
  setFlipped(false, false);
  void turn.offsetWidth;
  turn.classList.remove("reset");

  dialog.style.setProperty("--card-color", object.group.color);
  document.getElementById("postcardNumber").textContent = "Object " + object.id;
  document.getElementById("postcardTitle").textContent = object.name;
  document.getElementById("postcardCaption").textContent = object.description;
  document.getElementById("postcardStory").textContent = object.backText;
  document.getElementById("postcardCopy").scrollTop = 0;

  addPhoto(document.getElementById("postcardPhoto"), object);
  addToCartButton.textContent = cart.has(object.id)
  ? "Added to cart ✓"
  : "Add to cart +";

  if (!dialog.open) dialog.showModal();
  flipBack.focus({ preventScroll: true });
}

function moveCard(direction) {
  const count = visibleObjects.length;
  if (count > 1) {
    openObject((currentIndex + direction + count) % count);
  }
}

front.addEventListener("click", event => {
  if (event.target === flipBack || !String(window.getSelection())) {
    setFlipped(true);
  }
});

back.addEventListener("click", event => {
  if (event.target.closest("a")) return;

  if (event.target === flipFront || !String(window.getSelection())) {
    setFlipped(false);
  }
});

previous.hidden = next.hidden = visibleObjects.length < 2;
previous.addEventListener("click", () => moveCard(-1));
next.addEventListener("click", () => moveCard(1));

let pressedOutside = false;

dialog.addEventListener("pointerdown", event => {
  pressedOutside = event.target === dialog;
});

dialog.addEventListener("click", event => {
  if (pressedOutside && event.target === dialog) dialog.close();
  pressedOutside = false;
});

dialog.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    moveCard(event.key === "ArrowLeft" ? -1 : 1);
  }
});

dialog.addEventListener("close", () => {
  returnFocus?.focus({ preventScroll: true });
});

/* BUILD THE CATEGORY GRIDS */

const collection = document.getElementById("collection");
const buttonsById = new Map();

function objectButton(object, className) {
  const button = element("button", className);
  button.type = "button";
  button.setAttribute("aria-label", "View postcard for " + object.name);
  button.addEventListener("click", () => {
    openObject(visibleObjects.indexOf(object), button);
  });
  return button;
}

for (const group of shownGroups) {
  const panel = element("section", "catalog-section");
  panel.style.setProperty("--section-color", group.color);

  const strip = element("div", "catalog-strip");
  const hero = element("div", "catalog-hero");
  const intro = element("div", "catalog-intro");
  const title = element("h2", "catalog-title", group.name);
  title.id = "section-" + group.key;
  panel.setAttribute("aria-labelledby", title.id);

  const sectionNumber = String(sectionData.indexOf(group) + 1).padStart(2, "0");
  intro.append(
    element("p", "catalog-kicker", "Section " + sectionNumber + " / The Price of Luck"),
    title,
    element("p", "catalog-description", group.description)
  );
  hero.append(intro);

  const featured = group.items[0];
  const feature = objectButton(featured, "catalog-feature");
  const featurePhoto = element("span", "catalog-image");
  addPhoto(featurePhoto, featured);
  feature.append(
    featurePhoto,
    element("span", "catalog-feature-label", "Featured object / " + featured.name + " ↗")
  );
  hero.append(feature);

  const bar = element("div", "catalog-bar");
  bar.append(
    element("span", "", "Objects in this section"),
    element("span", "", group.items.length + " objects")
  );

  const grid = element("div", "catalog-grid");

  for (const object of group.items) {
    const button = objectButton(object, "catalog-object");
    const photo = element("span", "catalog-image");
    addPhoto(photo, object);

    const caption = element("span", "catalog-caption");
    const heading = element("span", "catalog-caption-top");
    heading.append(
      element("span", "catalog-object-title", object.name),
      element("span", "catalog-number", "No. " + String(object.id).padStart(2, "0"))
    );
    caption.append(heading);

    if (object.description) {
      caption.append(element("span", "catalog-object-caption", object.description));
    }

    button.append(photo, caption);
    buttonsById.set(object.id, button);
    const tile = element("div", "catalog-tile");
const cartButton = element("button", "grid-cart", "Add to cart +");

cartButton.type = "button";
cartButton.dataset.cartId = String(object.id);
cartButton.setAttribute("aria-label", "Add " + object.name + " to cart");

cartButton.addEventListener("click", () => {
  addObjectToCart(object);
});

tile.append(button, cartButton);
grid.append(tile);
  }

  panel.append(strip, hero, bar, grid);
  collection.append(panel);
}

/* CART AND PERSONALIZED POSTCARDS */

const cartToggle = document.getElementById("cartToggle");
const cartDialog = document.getElementById("cartDialog");
const cartItems = document.getElementById("cartItems");
const addToCartButton = document.getElementById("addToCart");
const allObjects = sectionData.flatMap(group => group.items);
const cartKey = "price-of-luck-cart";
const cart = new Map();

try {
  const saved = JSON.parse(localStorage.getItem(cartKey) || "[]");

  for (const [id, note] of saved) {
    if (allObjects.some(object => object.id === id)) {
      cart.set(id, typeof note === "string" ? note : "");
    }
  }
} catch {
  // The cart still works during this visit if browser storage is unavailable.
}

function saveCart() {
  cartToggle.textContent = "Cart (" + cart.size + ")";
  document.querySelectorAll("[data-cart-id]").forEach(button => {
  const added = cart.has(Number(button.dataset.cartId));
  button.textContent = added ? "Added ✓" : "Add to cart +";
  button.disabled = added;
});

  try {
    localStorage.setItem(cartKey, JSON.stringify([...cart]));
  } catch {
    // The cart remains available until the page is closed.
  }
}

function renderCart() {
  cartItems.replaceChildren();

  if (!cart.size) {
    cartItems.append(element("p", "", "Your cart is empty."));
    return;
  }

  for (const [id, savedNote] of cart) {
    const object = allObjects.find(item => item.id === id);
    const form = element("form", "cart-item");
    form.style.setProperty("--item-color", object.group.color);

    const toLabel = element("label", "", "Recipient’s email");
    const recipient = element("input");
    recipient.type = "email";
    recipient.required = true;
    recipient.placeholder = "friend@example.com";
    toLabel.append(recipient);

    const noteLabel = element("label", "", "Your note (up to 200 characters)");
    const note = element("textarea");
    note.rows = 4;
    note.maxLength = 200;
    note.required = true;
    note.value = savedNote;
    note.placeholder = "A little luck for whatever comes next…";
    noteLabel.append(note);
    const preview = element("div", "cart-preview");
preview.style.setProperty("--card-color", object.group.color);

const previewFront = element("div", "cart-preview-card");
previewFront.hidden = true;

const previewHeading = element("div", "postcard-heading");
previewHeading.append(
  element("div", "postcard-number", "Object " + object.id),
  element("h3", "postcard-title", object.name)
);

const previewPhoto = element("div", "postcard-photo");
addPhoto(previewPhoto, object);
previewFront.append(previewHeading, previewPhoto);

if (object.description) {
  previewFront.append(
    element("p", "postcard-caption", object.description)
  );
}

const previewBack = element("div", "cart-preview-card cart-preview-back");
const previewCopy = element("div", "postcard-copy");
const previewCopyInner = element("div", "postcard-copy-inner");
const previewMessage = element("p", "postcard-story");

previewCopyInner.append(previewMessage);
previewCopy.append(previewCopyInner);
previewBack.append(previewCopy);

const previewFlip = element("button", "cart-preview-flip", "Preview front ↗");
previewFlip.type = "button";

function showPreviewBack(showBack) {
  previewFront.hidden = showBack;
  previewBack.hidden = !showBack;
  previewFlip.textContent = showBack ? "Preview front ↗" : "Preview back ↶";
}

function updatePreview() {
  const message = note.value.trim();
  previewMessage.textContent = message || "Your note will appear here.";
  previewMessage.classList.toggle("is-empty", !message);
}

previewFlip.addEventListener("click", () => {
  showPreviewBack(previewBack.hidden);
});

note.addEventListener("input", () => {
  updatePreview();
  showPreviewBack(true);
});

preview.append(previewFront, previewBack, previewFlip);
updatePreview();

    note.addEventListener("input", () => {
      cart.set(id, note.value);
      saveCart();
    });

    const actions = element("div", "cart-actions");
    const remove = element("button", "", "Remove");
    remove.type = "button";
    remove.addEventListener("click", () => {
      cart.delete(id);
      saveCart();
      renderCart();
    });

    const send = element("button", "", "Open email draft ↗");
    send.type = "submit";
    actions.append(remove, send);

    form.append(
  element("h3", "", object.name),
  toLabel,
  noteLabel,
  preview,
  actions
);

    form.addEventListener("submit", event => {
      event.preventDefault();

      const message = note.value.trim();
      if (!message) {
        note.focus();
        return;
      }

      const postcardUrl = new URL("category.html", window.location.href);
      postcardUrl.searchParams.set("section", object.group.key);
      postcardUrl.searchParams.set("object", String(object.id));
      postcardUrl.hash = new URLSearchParams({ note: message }).toString();

      const subject = "A little luck for you";
      const body = [
        message,
        "",
        "Open your postcard from The Price of Luck:",
        postcardUrl.href
      ].join("\r\n");

      window.location.href =
        "mailto:" + encodeURIComponent(recipient.value.trim()) +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
    });

    cartItems.append(form);
  }
}

function addObjectToCart(object) {
  if (!object) return;

  if (!cart.has(object.id)) cart.set(object.id, "");
  saveCart();
}

addToCartButton.addEventListener("click", () => {
  addObjectToCart(visibleObjects[currentIndex]);
  addToCartButton.textContent = "Added to cart ✓";
});

cartToggle.addEventListener("click", () => {
  renderCart();
  cartDialog.showModal();
});

document.getElementById("closeCart").addEventListener("click", () => {
  cartDialog.close();
});

saveCart();

/* Open a shared postcard and show the sender’s note. */

const emailedObjectId = params.get("object");

if (emailedObjectId !== null) {
  const index = visibleObjects.findIndex(object =>
    String(object.id) === emailedObjectId
  );

  if (index !== -1) {
    const button = buttonsById.get(visibleObjects[index].id);
    button?.scrollIntoView({ block: "center" });
    openObject(index, button);

    const sharedNote = new URLSearchParams(window.location.hash.slice(1))
      .get("note");

    if (sharedNote) {
      document.getElementById("postcardStory").textContent = sharedNote;
      setFlipped(true);
    }
  }
}
</script>
</body>
</html>
