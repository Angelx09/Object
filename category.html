<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Price of Luck — Objects</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&display=swap"
>

<style>
* { box-sizing: border-box; }
  @import url("https://use.typekit.net/wcs7vbf.css");
body {
  margin: 0;
  background: #faf9f6;
  color: #191919;
  font-family: "Fraunces", Arial, Helvetica, sans-serif;
}

button, a { font: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }

button:focus-visible,
a:focus-visible {
  outline: 2px solid #191919;
  outline-offset: 4px;
}

/* HEADER */

header {
  position: relative;
  min-height: 80px;
  padding: 25px 34px;
  display: flex;
  align-items: center;
}

.site-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 16px;
  letter-spacing: -.03em;
  text-transform: lowercase;
}

.back-link {
  font-size: 11px;
  color: #777;
}

/* SECTION LINKS */

.section-nav {
  padding: 20px 34px 35px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 25px;
}

.section-nav a {
  color: #999;
  font-size: 12px;
  transition: color .2s;
}

.section-nav a[aria-current="page"] {
  color: #191919;
}

.section-nav a:hover,
.section-nav a:focus-visible {
  color: var(--section-hover, #191919);
}

/* GRID */

.collection-section {
  margin-bottom: 48px;
}

.object-grid {
  padding: 0 34px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 25px 20px;
}

/* SECTION COVER */

.section-cover {
  aspect-ratio: 2 / 3;
  min-width: 0;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--section-color);
}

.section-cover-number,
.section-cover-count {
  font-size: 10px;
  letter-spacing: .08em;
}

.section-cover h2 {
  margin: 0 0 18px;
  font-size: clamp(25px, 3vw, 46px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.06em;
  overflow-wrap: anywhere;
}

.section-cover p {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
}

/* OBJECT FRONT */

.object-card {
  aspect-ratio: 2 / 3;
  min-width: 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 12px #00000008;
  transition: transform .25s;
}

.object-card:hover {
  transform: translateY(-7px);
}

.card-heading {
  flex: 0 0 16.5%;
  width: 100%;
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--section-color);
  text-align: center;
  font-size: clamp(12px, 1.4vw, 20px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.04em;
}

.card-heading h2,
.card-heading h3 {
  margin: 3px 0 0;
  font: inherit;
}

.card-image-area {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 9% 16% 6%;
  background: #fff;
}

.card-brackets {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 0 8px;
}

.card-brackets::before,
.card-brackets::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 7px;
  border-top: 1px solid #ff0098;
  border-bottom: 1px solid #ff0098;
  pointer-events: none;
}

.card-brackets::before {
  left: 0;
  border-left: 1px solid #ff0098;
}

.card-brackets::after {
  right: 0;
  border-right: 1px solid #ff0098;
}

.photo {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.photo-placeholder {
  color: #bbb;
  font-size: 10px;
  text-align: center;
}

.card-caption {
  flex: 0 0 17%;
  min-height: 0;
  width: 100%;
  padding: 8px 12%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-caption p {
  margin: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
}

/* ENLARGED POSTCARD */

#objectDialog {
  width: min(440px, calc(100vw - 140px), 58vh);
  height: min(730px, 88vh);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 0;
  overflow: visible;
  background: transparent;
}

#objectDialog::backdrop {
  background: #faf9f699;
  backdrop-filter: blur(5px);
}

.modal-layout {
  position: relative;
  width: 100%;
  height: 100%;
}

.flip-stage {
  width: 100%;
  height: 100%;
  perspective: 1400px;
}

.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.2,.75,.2,1);
}

.flip-inner.flipped {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 15px 65px #00000022;
  cursor: pointer;
}

.front {
  transform: rotateY(0deg);
}

.front .card-heading {
  font-size: clamp(18px, 2.8vh, 28px);
}

.front .card-caption {
  overflow-y: auto;
}

.front .card-caption p {
  display: block;
  overflow: visible;
  font-size: 12px;
}

.flip-button {
  flex-shrink: 0;
  width: 100%;
  padding: 10px;
  border: 0;
  background: transparent;
  color: #777;
  font-size: 10px;
  cursor: pointer;
}

/* SECTION-COLORED BACK */

.back {
  transform: rotateY(180deg);
  background: var(--section-color);
  color: #000;
}

.back-content {
  flex: 1;
  min-height: 0;
  padding: 12% 25%;
  overflow-y: auto;
}

.back-copy {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

#purchaseMessage {
  margin: 0;
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(14px, 2vh, 19px);
  line-height: 1.2;
  text-align: left;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.purchase-link {
  margin-top: 22px;
  padding-bottom: 5px;
  border-bottom: 1px solid;
  font-family: "Fraunces", Times, serif;
  font-size: 13px;
}

.back .flip-button {
  color: #000;
  font-size: 9px;
  opacity: .5;
}

/* CIRCULAR ARROWS */

.postcard-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #fff;
  color: #191919;
  box-shadow: 0 2px 14px #00000012;
  display: grid;
  place-items: center;
  font-size: 21px;
  cursor: pointer;
  transition: background .2s;
}

.postcard-prev { left: -62px; }
.postcard-next { right: -62px; }

.postcard-arrow:hover {
  background: var(--section-color);
}
.back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  color: #191919;
  font-size: 24px;
}
/* RESPONSIVE */

@media (min-width: 1500px) {
  main {
    max-width: 1500px;
    margin: auto;
  }
}

@media (max-width: 850px) {
  .object-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .card-heading { font-size: 16px; }
}

@media (max-width: 600px) {
  #objectDialog {
    width: min(440px, calc(100vw - 112px), 58vh);
  }

  .postcard-arrow {
    width: 40px;
    height: 40px;
  }

  .postcard-prev { left: -48px; }
  .postcard-next { right: -48px; }

  .back-content { padding: 15% 18%; }
}

@media (max-width: 500px) {
  header {
    min-height: 95px;
    padding: 15px 16px;
    align-items: flex-start;
  }

  .site-title {
    top: 53px;
  }

  .section-nav {
    padding: 15px 16px 28px;
    gap: 14px;
  }

  .object-grid {
    padding: 0 16px;
    gap: 18px 12px;
  }

  .section-cover { padding: 15px; }
  .section-cover h2 { font-size: 25px; }
  .section-cover p { font-size: 10px; }
  .card-heading { font-size: 12px; }
  .card-caption p { font-size: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .object-card,
  .flip-inner,
  .postcard-arrow {
    transition: none;
  }
  
}
/* Object names on the grid and enlarged postcards */
.object-card .card-heading h3,
#modalTitle {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.05;
}

/* Short description on the front */
.card-caption p {
  font-family: "Fraunces", Georgia, serif;
  font-style: italic;
  font-weight: 400;
  line-height: 1.35;
}

/* Longer story on the back */
#purchaseMessage {
  font-family: "Fraunces", Georgia, serif;
  font-style: normal;
  font-weight: 400;
  line-height: 1.4;
}
.card-back .back-content,
.back .back-content {
  padding-inline: 12%;
}
/* EDITORIAL CATEGORY CATALOG */

.catalog-section {
  --catalog-rule: #b9b5ae;
  margin: 0 34px 64px;
  border: 1px solid var(--catalog-rule);
}

.catalog-strip {
  height: 7px;
  background: var(--section-color);
  border-bottom: 1px solid var(--catalog-rule);
}

.catalog-hero {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-bottom: 1px solid var(--catalog-rule);
}

.catalog-hero-text-only {
  grid-template-columns: 1fr;
}

.catalog-intro {
  padding: clamp(24px, 4vw, 64px);
}

.catalog-kicker,
.catalog-bar,
.catalog-feature-label,
.catalog-object-number {
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.catalog-kicker {
  margin: 0 0 22px;
}

.catalog-title {
  margin: 0 0 18px;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(36px, 6vw, 84px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.055em;
}

.catalog-description {
  max-width: 38ch;
  margin: 0;
  font-size: clamp(15px, 1.7vw, 21px);
  line-height: 1.5;
}

.catalog-feature,
.catalog-object {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.catalog-feature {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 18px;
  min-height: 320px;
  padding: 30px 24px 22px;
  border-left: 1px solid var(--catalog-rule);
  background: color-mix(in srgb, var(--section-color) 20%, #fff);
}

.catalog-feature-image.photo {
  width: min(78%, 300px);
  height: clamp(180px, 24vw, 330px);
  background: transparent;
}

.catalog-feature-label {
  text-align: center;
}

.catalog-bar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 18px;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.catalog-object {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--catalog-rule);
  border-left: 1px solid var(--catalog-rule);
}

.catalog-object:nth-child(4n + 1) {
  border-left: 0;
}

.catalog-object-image.photo {
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  padding: 14%;
  background: #fff;
}

.catalog-caption {
  width: 100%;
  padding: 14px 16px 18px;
}

.catalog-caption-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.catalog-caption h3 {
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: 16px;
  font-weight: 500;
}

.catalog-object-number {
  flex-shrink: 0;
  color: #57534d;
}

.catalog-object-caption {
  margin: 6px 0 0;
  font-size: 12px;
  line-height: 1.45;
  color: #57534d;
}

.catalog-feature:hover .catalog-feature-label,
.catalog-object:hover h3 {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.catalog-feature:focus-visible,
.catalog-object:focus-visible {
  outline-offset: -4px;
}

@media (max-width: 760px) {
  .catalog-section {
    margin: 0 16px 40px;
  }

  .catalog-hero {
    grid-template-columns: 1fr;
  }

  .catalog-feature {
    min-height: 0;
    border-left: 0;
    border-top: 1px solid var(--catalog-rule);
  }

  .catalog-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .catalog-object:nth-child(2n + 1) {
    border-left: 0;
  }

  .catalog-caption-top {
    flex-wrap: wrap;
  }
}
</style>
</head>

      { name: "Object 44", image: "images/object-44.jpg", description: "name", backText: "Behavior phenomenon" },
      { name: "Object 45", image: "images/object-45.jpg", description: "name", backText: "Behavior phenomenon" },
      { name: "Object 46", image: "images/object-46.jpg", description: "name", backText: "Behavior phenomenon" },
      { name: "Object 47", image: "images/object-47.jpg", description: "name", backText: "Behavior phenomenon" },
      { name: "Object 48", image: "images/object-48.jpg", description: "name", backText: "Behavior phenomenon" }
    ]
  }
];

/* PREPARE DATA */

let objectNumber = 0;

sectionData.forEach((group, groupIndex) => {
  group.items = group.items.map(item => ({
    ...item,
    id: ++objectNumber,
    groupIndex,
    description: item.description || "",
    backText: item.backText || item.backtxt || "",
    purchaseUrl: item.purchaseUrl || ""
  }));
});

const requested = new URLSearchParams(location.search).get("section");

const activeGroup = sectionData.findIndex((group, index) =>
  requested === String(index + 1) || requested === group.key
);

const shownGroups = activeGroup === -1
  ? sectionData
  : [sectionData[activeGroup]];

const visibleObjects = shownGroups.flatMap(group => group.items);

document.title =
  (activeGroup === -1 ? "All Objects" : sectionData[activeGroup].name)
  + " — The Price of Luck";

/* NAVIGATION */

const nav = document.getElementById("sectionNav");

function addNavLink(label, href, active, color = "#191919") {
  const link = document.createElement("a");
  link.textContent = label;
  link.href = href;
  link.style.setProperty("--section-hover", color);

  if (active) link.setAttribute("aria-current", "page");

  nav.appendChild(link);
}

addNavLink("All Objects", "category.html", activeGroup === -1);

sectionData.forEach((group, index) => {
  addNavLink(
    group.name,
    "?section=" + (index + 1),
    activeGroup === index,
    group.color
  );
});

/* PHOTO LOADING */

function addPhoto(container, object) {
  container.replaceChildren();

  const placeholder = document.createElement("span");
  placeholder.className = "photo-placeholder";
  placeholder.textContent = "Add object photo";
  container.appendChild(placeholder);

  if (!object.image) return;

  const image = document.createElement("img");
  image.alt = object.name;
  image.hidden = true;

  image.addEventListener("load", () => {
    placeholder.remove();
    image.hidden = false;
  });

  image.addEventListener("error", () => image.remove());

  container.appendChild(image);
  image.src = object.image;
}

/* BUILD CATEGORY CATALOG */

const collection = document.getElementById("collection");

shownGroups.forEach(group => {
  const groupIndex = sectionData.indexOf(group);
  const sectionNumber = String(groupIndex + 1).padStart(2, "0");

  const section = document.createElement("section");
  section.className = "catalog-section";
  section.style.setProperty("--section-color", group.color);

  section.innerHTML = `
    <div class="catalog-strip"></div>

    <div class="catalog-hero">
      <div class="catalog-intro">
        <p class="catalog-kicker"></p>
        <h2 class="catalog-title"></h2>
        <p class="catalog-description"></p>
      </div>
    </div>

    <div class="catalog-bar">
      <span>Objects in this section</span>
      <span class="catalog-count"></span>
    </div>

    <div class="catalog-grid"></div>
  `;

  const title = section.querySelector(".catalog-title");
  title.id = `catalog-title-${groupIndex}`;
  title.textContent = group.name;
  section.setAttribute("aria-labelledby", title.id);

  section.querySelector(".catalog-kicker").textContent =
    `Section ${sectionNumber} / The Price of Luck`;

  section.querySelector(".catalog-description").textContent =
    group.description;

  section.querySelector(".catalog-count").textContent =
    `${group.items.length} ${group.items.length === 1 ? "object" : "objects"}`;

  function makeObjectButton(object, className) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.setAttribute("aria-label", `View postcard for ${object.name}`);

    button.addEventListener("click", () => {
      openObject(visibleObjects.indexOf(object), button);
    });

    return button;
  }

  /* Use the first object with an image as the section feature. */
  const featured = group.items.find(object => object.image);
  const hero = section.querySelector(".catalog-hero");

  if (featured) {
    const feature = makeObjectButton(featured, "catalog-feature");
    feature.innerHTML = `
      <div class="catalog-feature-image photo"></div>
      <span class="catalog-feature-label"></span>
    `;

    addPhoto(feature.querySelector(".photo"), featured);

    feature.querySelector(".catalog-feature-label").textContent =
      `Featured object / ${featured.name} ↗`;

    hero.appendChild(feature);
  } else {
    hero.classList.add("catalog-hero-text-only");
  }

  const grid = section.querySelector(".catalog-grid");

  group.items.forEach(object => {
    const card = makeObjectButton(object, "catalog-object");

    card.innerHTML = `
      <div class="catalog-object-image photo"></div>
      <div class="catalog-caption">
        <div class="catalog-caption-top">
          <h3></h3>
          <span class="catalog-object-number"></span>
        </div>
        <p class="catalog-object-caption"></p>
      </div>
    `;

    addPhoto(card.querySelector(".photo"), object);
    card.querySelector("h3").textContent = object.name;

    card.querySelector(".catalog-object-number").textContent =
      `No. ${String(object.id).padStart(2, "0")}`;

    const caption = card.querySelector(".catalog-object-caption");
    caption.textContent = object.description || "";
    caption.hidden = !object.description;

    grid.appendChild(card);
  });

  collection.appendChild(section);
});

/* POSTCARD CONTROLS */

const dialog = document.getElementById("objectDialog");
const modalLayout = document.getElementById("modalLayout");
const flipInner = document.getElementById("flipInner");
const frontFace = document.getElementById("frontFace");
const backFace = document.getElementById("backFace");
const flipBack = document.getElementById("flipBack");
const flipFront = document.getElementById("flipFront");
const purchaseLink = document.getElementById("purchaseLink");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

let currentIndex = 0;
let savedOverflow = "";
let returnFocus = null;

function setFlipped(value, moveFocus = true) {
  const visibleFace = value ? backFace : frontFace;
  visibleFace.inert = false;
  visibleFace.setAttribute("aria-hidden", "false");

  if (moveFocus) {
    (value ? flipFront : flipBack).focus({ preventScroll: true });
  }

  frontFace.inert = value;
  backFace.inert = !value;

  frontFace.setAttribute("aria-hidden", String(value));
  backFace.setAttribute("aria-hidden", String(!value));

  flipInner.classList.toggle("flipped", value);
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch {
    return "";
  }
}

function openObject(index, trigger = null) {
  if (!visibleObjects.length) return;

  currentIndex =
    (index + visibleObjects.length) % visibleObjects.length;

  const object = visibleObjects[currentIndex];
  const group = sectionData[object.groupIndex];
  const alreadyOpen = dialog.open;

  if (!alreadyOpen) {
    returnFocus = trigger || document.activeElement;
  } else {
    nextButton.focus({ preventScroll: true });
  }

  /* Reset to the front without animating backward. */

  flipInner.style.transition = "none";
  setFlipped(false, false);
  void flipInner.offsetWidth;
  flipInner.style.transition = "";

  modalLayout.style.setProperty("--section-color", group.color);

  document.getElementById("modalNumber").textContent =
    "Object " + object.id;

  document.getElementById("modalTitle").textContent = object.name;

  document.getElementById("modalDescription").textContent =
    object.description;

  document.getElementById("purchaseMessage").textContent =
    object.backText;

  addPhoto(document.getElementById("modalPhoto"), object);

  const url = safeUrl(object.purchaseUrl);
  purchaseLink.hidden = !url;

  if (url) {
    purchaseLink.href = url;
  } else {
    purchaseLink.removeAttribute("href");
  }

  frontFace.querySelector(".card-caption").scrollTop = 0;
  document.getElementById("backContent").scrollTop = 0;

  if (!alreadyOpen) {
    savedOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    dialog.showModal();
  }

  flipBack.focus({ preventScroll: true });
}

/* CLICK POSTCARD TO FLIP */

frontFace.addEventListener("click", () => {
  if (!window.getSelection()?.toString()) {
    setFlipped(true);
  }
});

backFace.addEventListener("click", event => {
  if (event.target.closest("a")) return;

  if (!window.getSelection()?.toString()) {
    setFlipped(false);
  }
});

/* CIRCULAR PREVIOUS / NEXT ARROWS */

previousButton.addEventListener("click", event => {
  event.stopPropagation();
  openObject(currentIndex - 1);
});

nextButton.addEventListener("click", event => {
  event.stopPropagation();
  openObject(currentIndex + 1);
});

/* CLOSE WHEN BOTH PRESS AND RELEASE ARE OUTSIDE */

let pressedOutside = false;

function isOutsidePostcard(target) {
  return target instanceof Element &&
    !target.closest(".face, .postcard-arrow");
}

dialog.addEventListener("pointerdown", event => {
  pressedOutside = isOutsidePostcard(event.target);
});

dialog.addEventListener("click", event => {
  if (pressedOutside && isOutsidePostcard(event.target)) {
    dialog.close();
  }

  pressedOutside = false;
});

/* KEYBOARD LEFT / RIGHT NAVIGATION
   Escape closes the native dialog automatically. */

dialog.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.key === "ArrowLeft") {
    event.preventDefault();
    openObject(currentIndex - 1);
  }

  if (event.key === "ArrowRight") {
    event.preventDefault();
    openObject(currentIndex + 1);
  }
});

dialog.addEventListener("close", () => {
  document.body.style.overflow = savedOverflow;
  returnFocus?.focus({ preventScroll: true });
});
</script>

</body>
</html>
