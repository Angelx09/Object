<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Price of Luck — Objects</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #faf9f6;
  color: #191919;
  font-family: Arial, Helvetica, sans-serif;
}

button, a { font: inherit; }
a { color: inherit; text-decoration: none; }
button { color: inherit; }
[hidden] { display: none !important; }

header {
  padding: 25px 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.site-title {
  font-size: 16px;
  letter-spacing: -.03em;
  text-transform: lowercase;
}

.back-link {
  font-size: 11px;
  color: #777;
}

/* NAVIGATION */

.section-nav {
  padding: 20px 34px 35px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 25px;
}

.section-nav a {
  font-size: 12px;
  color: #999;
}

.section-nav a {
  transition: color .2s ease;
}

.section-nav a:hover,
.section-nav a:focus-visible {
  color: var(--hover-color, #191919);
}

.section-nav a[aria-current="page"] {
  color: #191919;
}

.section-nav a[aria-current="page"]:hover {
  color: var(--hover-color, #191919);
}

/* EACH SECTION HAS ITS OWN GRID */

.collection-section {
  margin-bottom: 48px;
}

.object-grid {
  padding: 0 34px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 25px 20px;
}

/* SECTION COVER */

.section-cover {
  aspect-ratio: 2 / 3;
  min-width: 0;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--section-color);
}

.section-cover-number,
.section-cover-count {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.section-cover h2 {
  margin: 0 0 18px;
  font-size: clamp(25px, 3vw, 46px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.06em;
  overflow-wrap: anywhere;
}

.section-cover p {
  margin: 0;
  font-size: 12px;
  line-height: 1.5;
}

/* OBJECT CARDS */

.object-card {
  aspect-ratio: 2 / 3;
  min-width: 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 12px #00000008;
  transition: transform .25s;
}

.object-card:hover {
  transform: translateY(-7px);
}

.object-card:focus-visible,
button:focus-visible,
a:focus-visible {
  outline: 2px solid #191919;
  outline-offset: 3px;
}

.card-heading {
  flex: 0 0 16.5%;
  width: 100%;
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--section-color);
  text-align: center;
  font-size: clamp(12px, 1.4vw, 20px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.04em;
}

.card-heading h3 {
  margin: 3px 0 0;
  font: inherit;
}

.card-image-area {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 9% 16% 6%;
  background: #fff;
}

.card-brackets {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 0 8px;
}

.card-brackets::before,
.card-brackets::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 7px;
  border-top: 1px solid #ff0098;
  border-bottom: 1px solid #ff0098;
  pointer-events: none;
}

.card-brackets::before {
  left: 0;
  border-left: 1px solid #ff0098;
}

.card-brackets::after {
  right: 0;
  border-right: 1px solid #ff0098;
}

.photo {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.photo-placeholder {
  color: #bbb;
  font-size: 10px;
  text-align: center;
}

.card-caption {
  flex: 0 0 17%;
  min-height: 0;
  width: 100%;
  padding: 8px 12%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-caption p {
  margin: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
}

/* ENLARGED CARD */

dialog {
  width: min(440px, 88vw, 58vh);
  height: min(730px, 88vh);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 0;
  overflow: visible;
  background: transparent;
}

dialog::backdrop {
  background: #faf9f699;
  backdrop-filter: blur(5px);
}

.modal-layout {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.flip-stage {
  flex: 1;
  min-height: 0;
  perspective: 1400px;
}

.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.2,.75,.2,1);
}

.flip-inner.flipped {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 15px 65px #00000022;
  cursor: pointer;
}

.front { transform: rotateY(0deg); }

.front .card-heading {
  font-size: clamp(18px, 2.8vh, 28px);
}

.front .card-heading h2 {
  margin: 4px 0 0;
  font: inherit;
}

.front .card-caption {
  overflow-y: auto;
}

.front .card-caption p {
  display: block;
  font-size: 12px;
}

.flip-button {
  flex-shrink: 0;
  width: 100%;
  padding: 10px;
  border: 0;
  background: transparent;
  color: #777;
  font-size: 10px;
  cursor: pointer;
}

.back {
  transform: rotateY(180deg);
  padding: 28px;
  background: var(--section-color);
}

.back-eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.back-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

.back-content h2 {
  margin: 14px 0;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -.05em;
}

.back-content p {
  font-size: 12px;
  line-height: 1.6;
}

.purchase-link {
  margin-top: 20px;
  padding-bottom: 5px;
  border-bottom: 1px solid;
  font-size: 13px;
}

.modal-controls {
  flex: 0 0 44px;
  display: flex;
  justify-content: space-between;
  background: #fff;
}

.modal-controls button {
  border: 0;
  padding: 0 16px;
  background: transparent;
  font-size: 11px;
  cursor: pointer;
}

.modal-controls button:hover {
  background: #f1eee7;
}

/* RESPONSIVE */

@media (min-width: 1500px) {
  main {
    max-width: 1500px;
    margin: auto;
  }
}

@media (max-width: 850px) {
  .object-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .card-heading { font-size: 16px; }
}

@media (max-width: 500px) {
  header { padding: 22px 16px; }

  .section-nav {
    padding: 15px 16px 28px;
    gap: 14px;
  }

  .object-grid {
    padding: 0 16px;
    gap: 18px 12px;
  }

  .section-cover { padding: 15px; }
  .section-cover h2 { font-size: 25px; }
  .section-cover p { font-size: 10px; }
  .card-heading { font-size: 12px; }
  .card-caption p { font-size: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .object-card,
  .flip-inner {
    transition: none;
  }
}
/* Section colors — main page and category page */

.categories a:nth-child(2),
.section-nav a:nth-child(2) {
  --section-hover: #fff500;
}

.categories a:nth-child(3),
.section-nav a:nth-child(3) {
  --section-hover: #ff9bcb;
}

.categories a:nth-child(4),
.section-nav a:nth-child(4) {
  --section-hover: #b9dfff;
}

.categories a:nth-child(5),
.section-nav a:nth-child(5) {
  --section-hover: #bfe6ae;
}

.categories a:nth-child(6),
.section-nav a:nth-child(6) {
  --section-hover: #ffc18c;
}

.categories a:nth-child(7),
.section-nav a:nth-child(7) {
  --section-hover: #cdbbfa;
}

.categories a,
.section-nav a {
  transition: color .2s ease;
}

.categories a:hover,
.categories a:focus-visible,
.section-nav a:hover,
.section-nav a:focus-visible {
  color: var(--section-hover, #191919) !important;
}
/* POSTCARD BACK */

.back {
  padding: 0;
  background: var(--section-color, #fff500);
  color: #000;
}

.back .back-eyebrow,
.back #backTitle {
  display: none;
}

.back .back-content {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 12% 25%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  overflow-y: auto;
}

.back #purchaseMessage {
  flex-shrink: 0;
  margin: 0;
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(14px, 2vh, 19px);
  font-weight: 400;
  line-height: 1.2;
  text-align: left;
  white-space: pre-line;
}

.back .purchase-link {
  align-self: flex-start;
  flex-shrink: 0;
  margin-top: 22px;
  font-family: "Times New Roman", Times, serif;
  font-size: 13px;
}

.back .flip-button {
  color: #000;
  font-size: 9px;
  opacity: .5;
}
header {
  position: relative;
  justify-content: flex-start;
  min-height: 70px;
}

header .site-title {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}
</style>
</head>

<body>

<header>
  <a class="back-link" href="index.html">← Back to stack</a>
  <a class="site-title" href="index.html">The price of luck</a>
</header>

<nav class="section-nav" id="sectionNav" aria-label="Sections"></nav>

<main id="collection"></main>

<dialog id="objectDialog" aria-label="Object details">
  <div class="modal-layout" id="modalLayout">

    <div class="flip-stage">
      <div class="flip-inner" id="flipInner">

        <div class="face front" id="frontFace">
          <div class="card-heading">
            <div id="modalNumber"></div>
            <h2 id="modalTitle"></h2>
          </div>

          <div class="card-image-area">
            <div class="card-brackets">
              <div class="photo" id="modalPhoto"></div>
            </div>
          </div>

          <div class="card-caption">
            <p id="modalDescription"></p>
          </div>

          <button class="flip-button" id="flipBack" type="button">
            Click to see where to purchase ↗
          </button>
        </div>

        <div class="face back" id="backFace" inert aria-hidden="true">
          <div class="back-eyebrow">The price of luck</div>

          <div class="back-content">
            <h2 id="backTitle"></h2>
            <p id="purchaseMessage"></p>

            <a
              class="purchase-link"
              id="purchaseLink"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              Visit website ↗
            </a>
          </div>

          <button class="flip-button" id="flipFront" type="button">
            Click to return ↶
          </button>
        </div>

      </div>
    </div>

    <div class="modal-controls">
      <button id="closeButton" type="button">Close</button>
      <button id="nextButton" type="button">Next object →</button>
    </div>

  </div>
</dialog>

<script>
/* ==========================================
    Category page script
========================================== */

const sectionData = [
  {
    key: "wearables",
    name: "Wearables",
    color: "#FFF500",
    description: "Objects worn close to the body, carrying luck and protection.",
    items: [
      { name: "Wearable 1", image: "images/jade-heart-necklace.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 2", image: "images/Yellow Gold Scorpio Necklace.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 3", image: "images/polished-wooden-bead-bracelet.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 4", image: "images/red-twisted-cord.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 5", image: "images/golden-bead-bracelet.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 6", image: "images/watch.jpeg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 7", image: "images/black-beaded-necklace.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" },
      { name: "Wearable 8", image: "images/silver-chain.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person.", backtxt:"boo",purchaseUrl: "" }
    ]
  },
  {
    key: "rituals",
    name: "Rituals",
    color: "#FF9BCB",
    description: "Objects given meaning through repeated actions and beliefs.",
    items: [
      { name: "Ritual Object 1", image: "images/Amethyst-cathedral.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 2", image: "images/Framed-Chinese-Amber-Ornament.png", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 3", image: "images/object-11.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 4", image: "images/object-12.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 5", image: "images/object-13.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 6", image: "images/object-14.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 7", image: "images/object-15.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." },
      { name: "Ritual Object 8", image: "images/object-16.jpg", description: "personal story word filling up this postcards about how the object holds significant meanings to this person." }
    ]
  },
  {
    key: "paper",
    name: "Paper",
    color: "#B9DFFF",
    description: "Wishes, messages, and memories held on paper.",
    items: [
      { name: "Paper Object 1", image: "images/Red.png" },
      { name: "Paper Object 2", image: "images/yellow-tailsman.png" },
      { name: "Paper Object 3", image: "images/object-19.jpg" },
      { name: "Paper Object 4", image: "images/object-20.jpg" },
      { name: "Paper Object 5", image: "images/object-21.jpg" },
      { name: "Paper Object 6", image: "images/object-22.jpg" },
      { name: "Paper Object 7", image: "images/object-23.jpg" },
      { name: "Paper Object 8", image: "images/object-24.jpg" }
    ]
  },
  {
    key: "keychains",
    name: "Keychains",
    color: "#BFE6AE",
    description: "Small companions carried from place to place.",
    items: [
      { name: "Keychain 1", image: "images/Eggplant-plush-keychain.png" },
      { name: "Keychain 2", image: "images/pink-plush-keychain.png" },
      { name: "Keychain 3", image: "images/object-27.jpg" },
      { name: "Keychain 4", image: "images/object-28.jpg" },
      { name: "Keychain 5", image: "images/object-29.jpg" },
      { name: "Keychain 6", image: "images/object-30.jpg" },
      { name: "Keychain 7", image: "images/object-31.jpg" },
      { name: "Keychain 8", image: "images/object-32.jpg" }
    ]
  },
  {
    key: "found",
    name: "Found Objects",
    color: "#FFC18C",
    description: "Unexpected discoveries given a meaning of their own.",
    items: [
      { name: "Found Object 1", image: "images/Lysol.png" },
      { name: "Found Object 2", image: "images/Light-aqua-blue-helmet.png" },
      { name: "Found Object 3", image: "images/yellow-pencil.png" },
      { name: "Found Object 4", image: "images/object-36.jpg" },
      { name: "Found Object 5", image: "images/object-37.jpg" },
      { name: "Found Object 6", image: "images/object-38.jpg" },
      { name: "Found Object 7", image: "images/object-39.jpg" },
      { name: "Found Object 8", image: "images/object-40.jpg" }
    ]
  },
  {
    key: "others",
    name: "Others",
    color: "#CDBBFA",
    description: "Other ordinary objects with extraordinary personal meaning.",
    items: [
      { name: "Object 41", image: "images/object-41.jpg" },
      { name: "Object 42", image: "images/object-42.jpg" },
      { name: "Object 43", image: "images/object-43.jpg" },
      { name: "Object 44", image: "images/object-44.jpg" },
      { name: "Object 45", image: "images/object-45.jpg" },
      { name: "Object 46", image: "images/object-46.jpg" },
      { name: "Object 47", image: "images/object-47.jpg" },
      { name: "Object 48", image: "images/object-48.jpg" }
    ]
  }
];

/* PREPARE OBJECTS */

let objectNumber = 0;

sectionData.forEach((group, groupIndex) => {
  group.items = group.items.map(item => ({
    ...item,
    id: ++objectNumber,
    groupIndex,
    description: item.description || "Add this object's story here.",
    purchaseUrl: item.purchaseUrl || ""
  }));
});

const params = new URLSearchParams(location.search);
const requested = params.get("section");

/* Supports both ?section=1 and ?section=wearables. */

const activeGroup = sectionData.findIndex((group, index) =>
  requested === String(index + 1) || requested === group.key
);

const shownGroups = activeGroup === -1
  ? sectionData
  : [sectionData[activeGroup]];

const visibleObjects = shownGroups.flatMap(group => group.items);

document.title =
  (activeGroup === -1 ? "All Objects" : sectionData[activeGroup].name)
  + " — The Price of Luck";

/* NAVIGATION */

const nav = document.getElementById("sectionNav");

function addNavLink(label, href, active) {
  const link = document.createElement("a");
  link.textContent = label;
  link.href = href;

  if (active) link.setAttribute("aria-current", "page");

  nav.appendChild(link);
}

addNavLink("All Objects", "category.html", activeGroup === -1);

sectionData.forEach((group, index) => {
  addNavLink(
    group.name,
    "?section=" + (index + 1),
    activeGroup === index
  );
});

/* PHOTOS — PLACEHOLDER IF A FILE IS MISSING */

function addPhoto(container, object) {
  container.replaceChildren();

  const placeholder = document.createElement("span");
  placeholder.className = "photo-placeholder";
  placeholder.textContent = "Add object photo";
  container.appendChild(placeholder);

  if (!object.image) return;

  const image = document.createElement("img");
  image.alt = object.name;
  image.hidden = true;

  image.addEventListener("load", () => {
    placeholder.remove();
    image.hidden = false;
  });

  image.addEventListener("error", () => image.remove());

  container.appendChild(image);
  image.src = object.image;
}

/* BUILD SECTION GRIDS */

const collection = document.getElementById("collection");

shownGroups.forEach(group => {
  const groupIndex = sectionData.indexOf(group);

  const section = document.createElement("section");
  section.className = "collection-section";
  section.style.setProperty("--section-color", group.color);

  const grid = document.createElement("div");
  grid.className = "object-grid";

  /* Section cover always appears. */

  const cover = document.createElement("article");
  cover.className = "section-cover";

  const number = document.createElement("div");
  number.className = "section-cover-number";
  number.textContent =
    "SECTION " + String(groupIndex + 1).padStart(2, "0");

  const content = document.createElement("div");

  const heading = document.createElement("h2");
  heading.id = "section-heading-" + groupIndex;
  heading.textContent = group.name;

  section.setAttribute("aria-labelledby", heading.id);

  const introduction = document.createElement("p");
  introduction.textContent = group.description;

  content.append(heading, introduction);

  const count = document.createElement("div");
  count.className = "section-cover-count";
  count.textContent = group.items.length + " OBJECTS";

  cover.append(number, content, count);
  grid.appendChild(cover);

  /* Object cards */

  group.items.forEach(object => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "object-card";
    card.setAttribute("aria-label", "View " + object.name);

    const titleBand = document.createElement("div");
    titleBand.className = "card-heading";

    const objectLabel = document.createElement("div");
    objectLabel.textContent = "Object " + object.id;

    const title = document.createElement("h3");
    title.textContent = object.name;

    titleBand.append(objectLabel, title);

    const imageArea = document.createElement("div");
    imageArea.className = "card-image-area";

    const brackets = document.createElement("div");
    brackets.className = "card-brackets";

    const photo = document.createElement("div");
    photo.className = "photo";
    addPhoto(photo, object);

    brackets.appendChild(photo);
    imageArea.appendChild(brackets);

    const caption = document.createElement("div");
    caption.className = "card-caption";

    const story = document.createElement("p");
    story.textContent = object.description;

    caption.appendChild(story);
    card.append(titleBand, imageArea, caption);

    card.addEventListener("click", () => {
      openObject(visibleObjects.indexOf(object));
    });

    grid.appendChild(card);
  });

  section.appendChild(grid);
  collection.appendChild(section);
});

/* ENLARGED CARD AND FLIP */

const dialog = document.getElementById("objectDialog");
const modalLayout = document.getElementById("modalLayout");
const flipInner = document.getElementById("flipInner");
const frontFace = document.getElementById("frontFace");
const backFace = document.getElementById("backFace");
const flipBack = document.getElementById("flipBack");
const flipFront = document.getElementById("flipFront");
const purchaseLink = document.getElementById("purchaseLink");

let currentIndex = 0;
let flipped = false;
let savedOverflow = "";

function setFlipped(value, focusButton = true) {
  flipped = value;

  const nextFace = value ? backFace : frontFace;
  nextFace.inert = false;
  nextFace.setAttribute("aria-hidden", "false");

  if (focusButton) {
    (value ? flipFront : flipBack).focus({ preventScroll: true });
  }

  frontFace.inert = value;
  backFace.inert = !value;

  frontFace.setAttribute("aria-hidden", String(value));
  backFace.setAttribute("aria-hidden", String(!value));

  flipInner.classList.toggle("flipped", value);
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function openObject(index) {
  currentIndex = index;

  const object = visibleObjects[index];
  const group = sectionData[object.groupIndex];

  /* Reset the flip before showing the next object. */

  document.getElementById("closeButton").focus();

  flipInner.style.transition = "none";
  setFlipped(false, false);
  void flipInner.offsetWidth;
  flipInner.style.transition = "";

  modalLayout.style.setProperty("--section-color", group.color);

  document.getElementById("modalNumber").textContent =
    "Object " + object.id;

  document.getElementById("modalTitle").textContent = object.name;
  document.getElementById("backTitle").textContent = object.name;

  document.getElementById("modalDescription").textContent =
    object.description;

  addPhoto(document.getElementById("modalPhoto"), object);

  const url = safeUrl(object.purchaseUrl);

  purchaseLink.hidden = !url;

  if (url) {
    purchaseLink.href = url;
  } else {
    purchaseLink.removeAttribute("href");
  }

  document.getElementById("purchaseMessage").textContent =
  object.backText || object.description;

  frontFace.querySelector(".card-caption").scrollTop = 0;

  if (!dialog.open) {
    savedOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    dialog.showModal();
  }

  flipBack.focus({ preventScroll: true });
}

frontFace.addEventListener("click", () => {
  if (!window.getSelection()?.toString()) setFlipped(true);
});

backFace.addEventListener("click", event => {
  if (event.target.closest("a")) return;
  if (!window.getSelection()?.toString()) setFlipped(false);
});

document.getElementById("closeButton").addEventListener("click", () => {
  dialog.close();
});

document.getElementById("nextButton").addEventListener("click", () => {
  openObject((currentIndex + 1) % visibleObjects.length);
});
document.getElementById("purchaseMessage").textContent =
  object.backText || "";

/* Click outside the card to close. */

dialog.addEventListener("click", event => {
  if (event.target !== dialog) return;

  const bounds = dialog.getBoundingClientRect();

  if (
    event.clientX < bounds.left ||
    event.clientX > bounds.right ||
    event.clientY < bounds.top ||
    event.clientY > bounds.bottom
  ) {
    dialog.close();
  }
});

dialog.addEventListener("close", () => {
  document.body.style.overflow = savedOverflow;
});
</script>

</body>
